<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>당근웹 로그 · HA</title><link rel="stylesheet" href="css/generated/design-tokens.css">

<link rel="stylesheet" href="css/layout_tokens.css">
<link rel="stylesheet" href="css/hud_card.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/generated/design-system.css">
<link rel="stylesheet" href="css/components.css">

<link rel="stylesheet" href="css/responsive.css">

<link rel="stylesheet" href="css/generated/logs.css"><style>html,body{height:100%;margin:0;overflow:hidden}body{display:flex;flex-direction:column;background:var(--md-surface,#121316)}:root{--nav-bar-height:0px;--nav-bar-height-desktop:0px}.page--logs{display:flex!important;flex:1;min-height:0;padding:0}.logs-shell{height:100%;min-height:0}#haLogsStatus{padding:10px 14px;font-size:12px;flex:none;border-bottom:1px solid #444}#haLogsStatus button{margin-left:8px}#haLogsError{color:#ffb4ab}#logsScreenPanel:before{content:'화면 녹화 동기화는 다음 단계에서 연결됩니다.';display:block;padding:16px}</style></head><body><div id="haLogsStatus" role="status">HA 로그 연결 중…</div>    <div id="pageLogs" class="page page--full page--logs">
      <div class="logs-shell">
        <div class="logs-tabbar">
          <div id="logsTabs" class="logs-tabs c-segmented-control c-segmented-control--equal"
               role="tablist" aria-label="로그">
            <button id="logsTabDashcam" class="c-segmented-control__item is-active" type="button"
                    role="tab" aria-selected="true" aria-controls="logsDashcamPanel" tabindex="0"
                    data-logs-tab="dashcam">
              <span id="logsDashcamTitle" class="c-segmented-control__label">대시캠</span>
            </button>
            <button id="logsTabScreen" class="c-segmented-control__item" type="button"
                    role="tab" aria-selected="false" aria-controls="logsScreenPanel" tabindex="-1"
                    data-logs-tab="screen">
              <span id="logsScreenTitle" class="c-segmented-control__label">화면녹화</span>
            </button>
          </div>
          <!-- Menu contents live in the shared choice dialog (see logs runtime),
               so only the trigger is markup here. -->
          <div id="logsMenu" class="ui-dropdown-menu logs-menu">
            <button id="logsMenuButton" class="ui-dropdown-menu__button logs-menu__button" type="button"
                    aria-haspopup="dialog" aria-label="로그 메뉴" title="로그 메뉴">
              <span class="ui-menu-icon" aria-hidden="true">
                <span class="ui-menu-icon__line"></span>
                <span class="ui-menu-icon__line"></span>
                <span class="ui-menu-icon__line"></span>
              </span>
            </button>
          </div>
        </div>

        <section id="logsDashcamPanel" class="logs-panel" role="tabpanel" aria-labelledby="logsTabDashcam">
          <div id="dashcamStatus" class="dashcam-status" hidden></div>
          <div id="dashcamRoutes" class="dashcam-routes"></div>
        </section>

        <section id="logsScreenPanel" class="logs-panel" role="tabpanel" hidden aria-labelledby="logsTabScreen">
          <div id="screenrecordStatus" class="dashcam-status" hidden></div>
          <div id="screenrecordVideos" class="screenrecord-list"></div>
        </section>
      </div>
    </div>

  <div id="appToastHost" class="app-toast-host" aria-live="polite" aria-atomic="true"></div>

  <div id="appDialog" class="app-dialog" hidden>
    <button id="appDialogBackdrop" class="app-dialog__backdrop" type="button" aria-label="Close dialog"></button>
    <div class="app-dialog__sheet" role="dialog" aria-modal="true" aria-labelledby="appDialogTitle" aria-describedby="appDialogBody">
      <div class="app-dialog__head">
        <div id="appDialogTitle" class="app-dialog__title">알림</div>
      </div>
      <div id="appDialogBody" class="app-dialog__body">-</div>
      <div id="appDialogChoices" class="app-dialog__choices" hidden></div>
      <div id="appDialogInputWrap" class="app-dialog__inputWrap" hidden>
        <input id="appDialogInput" type="text" class="input-text app-dialog__input" />
        <div id="appDialogInputError" class="app-dialog__inputError" role="alert" hidden></div>
      </div>
      <div class="app-dialog__actions">
        <button id="appDialogCopy" class="smallBtn" type="button" hidden>Copy</button>
        <button id="appDialogDefault" class="smallBtn" type="button" hidden>기본값</button>
        <button id="appDialogCancel" class="smallBtn" type="button">취소</button>
        <button id="appDialogConfirm" class="smallBtn btn--filled" type="button">확인</button>
      </div>
    </div>
  </div>

<script src="js/translations/registry.js"></script>
<script src="js/translations/ko.js"></script>
<script src="js/translations/en.js"></script>
<script src="js/generated/app.js"></script>
