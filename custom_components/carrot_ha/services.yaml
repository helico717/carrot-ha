purge_database:
  name: Purge Database
  description: Purges expired telemetry history and vacuums the database.

compress_archive:
  name: Compress archive without deleting records
  description: Creates a SQLite backup, compresses large state records losslessly, enables compressed writes, and vacuums. Explicit opt-in; requires free disk space.
  fields:
    entry_id:
      name: Config entry ID
      required: true
      selector:
        text:
restore_archive:
  name: Restore archive to plain JSON
  description: Disables compressed writes and restores all original JSON including records received after compression. Run before installing an older release.
  fields:
    entry_id:
      name: Config entry ID
      required: true
      selector:
        text:

start_can_capture:
  name: Start temporary raw CAN logging
  description: Store raw CAN batches in separate gzip analysis files on HA, with a configurable storage ceiling (default 20 GiB). Requires updated Comma and configured remote terminal discovery. No archive DB writes.
  fields:
    entry_id:
      required: true
      selector:
        text:
    hours:
      default: 12
      selector:
        number:
          min: 0.01
          max: 24
          mode: box
    max_gb:
      default: 20
      selector:
        number:
          min: 1
          max: 500
          mode: box
stop_can_capture:
  name: Stop temporary raw CAN logging
  description: Stop collecting new batches; keep captured files for analysis.
  fields:
    entry_id:
      required: true
      selector:
        text:
