<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>추이 차트 오버레이 스크롤 추적 프리뷰</title>
<!-- 실제 전체 차계부 모듈을 불러오는 합성 데이터 프리뷰. 프로덕션 코드를 변경하지 않는다.
저장소 루트에서 python3 -m http.server 8765 --bind 127.0.0.1 실행 후
http://127.0.0.1:8765/vehicle-journal/review-trend-tip-scroll.html 접속. -->
<style>
  :root{--j-bg:#0b1014;--j-surface:#161e25;--j-raised:#202c36;--j-border:#2a3945;--j-ink:#f1f6fa;--j-sub:#a8bdca;--j-accent:#81e6c5}
  html,body{margin:0;background:var(--j-bg);color:var(--j-ink);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Malgun Gothic",sans-serif}
  .bar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;background:#0f161c;border-bottom:1px solid var(--j-border);font-size:13px}
  .bar b{color:var(--j-accent)}
  .seg{display:inline-flex;border:1px solid var(--j-border);border-radius:10px;overflow:hidden}
  .seg button{background:var(--j-raised);color:var(--j-sub);border:0;padding:7px 12px;font-size:12.5px;cursor:pointer}
  .seg button[aria-pressed=true]{background:var(--j-accent);color:#0b1014;font-weight:700}
  .bar small{color:var(--j-sub)}
  .stage{display:flex;justify-content:center;align-items:flex-start;height:calc(100dvh - 54px);overflow:hidden}
  .stage iframe{border:0;display:block;background:var(--j-bg);width:100%;height:100%}
  .stage.mobile{padding:16px 12px;box-sizing:border-box;overflow:auto}
  .stage.mobile iframe{width:390px;height:800px;box-sizing:content-box;flex:0 0 auto;border-radius:36px;border:10px solid #1d262e;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  body.embed{overflow:auto;height:100%}
  body.embed .bar,body.embed .stage{display:none}
  #haScrollShell{display:none}
  body.embed #haScrollShell{display:block;height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch}
</style>
</head>
<body>
<div class="bar" id="bar">
  <b>추이 오버레이 스크롤 추적 프리뷰</b>
  <span class="seg" id="deviceSeg"><button data-device="desktop">데스크톱</button><button data-device="mobile">모바일 390×800</button></span>
  <span class="seg" id="fixSeg"><button data-fix="after">수정 후 (스크롤 추적)</button><button data-fix="before">수정 전 (고정)</button></span>
  <small>막대를 클릭/호버해 오버레이를 띄운 뒤 위아래로 스크롤해 보세요.</small>
</div>
<div class="stage" id="stage"><iframe id="frame" title="차계부 추이 스크롤 미리보기"></iframe></div>
<div id="haScrollShell"><main id="mount"></main></div>

<script type="module">
const params=new URLSearchParams(location.search);
const embed=params.has('embed');
const fixMode=params.get('fix')||'after';

if(!embed){
  const stage=document.getElementById('stage');
  const frame=document.getElementById('frame');
  let device='desktop',fix='after';
  const syncButtons=()=>{
    for(const b of document.querySelectorAll('#deviceSeg button'))b.setAttribute('aria-pressed',String(b.dataset.device===device));
    for(const b of document.querySelectorAll('#fixSeg button'))b.setAttribute('aria-pressed',String(b.dataset.fix===fix));
  };
  const loadFrame=()=>{
    stage.classList.toggle('mobile',device==='mobile');
    frame.src=`${location.pathname}?embed=1&fix=${fix}&t=${Date.now()}`;
    syncButtons();
  };
  document.getElementById('deviceSeg').addEventListener('click',e=>{
    const btn=e.target.closest('button[data-device]');if(!btn)return;
    device=btn.dataset.device;stage.classList.toggle('mobile',device==='mobile');syncButtons();
  });
  document.getElementById('fixSeg').addEventListener('click',e=>{
    const btn=e.target.closest('button[data-fix]');if(!btn)return;
    fix=btn.dataset.fix;loadFrame();
  });
  loadFrame();
}else{
  document.body.classList.add('embed');
  const v='preview-'+Date.now();
  const realFetch=window.fetch.bind(window);
  window.fetch=(url,opts)=>String(url).includes('/api/carrot_ha/frontend-version')
    ?Promise.resolve(new Response(JSON.stringify({version:'0.0.0-'+v})))
    :realFetch(url,opts);

  const now=new Date();
  const ym=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const prevDate=new Date(now.getFullYear(),now.getMonth()-1,1);
  const pym=`${prevDate.getFullYear()}-${String(prevDate.getMonth()+1).padStart(2,'0')}`;

  const makeDaily=(monthStr,scale=1)=>{
    const days=[];
    for(let d=1;d<=26;d+=2){
      const day=`${monthStr}-${String(d).padStart(2,'0')}`;
      const dist=Math.round((48+((d*17)%55))*scale*10)/10;
      const kwh=Math.round((dist/5.4)*10)/10;
      const chg=d%4===1?Math.round((24+((d*7)%18))*scale*10)/10:0;
      const cost=Math.round(chg*310)+(d===5?10000:0)+(d===13?45000:0);
      days.push({
        day,
        distance_km:dist,
        energy_distance_km:dist,
        drive_energy_kwh:kwh,
        battery_charge_kwh:chg,
        charge_effective_krw:Math.round(chg*310),
        drive_soc_used_pp:Math.round(kwh*1.3*10)/10,
        soc_distance_km:dist,
        slow_count:chg>0&&d%8===1?1:0,
        fast_count:chg>0&&d%8!==1?1:0,
        unknown_count:0,
        total_cost_krw:cost,
        cost_categories:{
          charging:{effective_krw:Math.round(chg*310)},
          ...(d===5?{washing:{effective_krw:10000}}:{}),
          ...(d===13?{maintenance:{effective_krw:45000}}:{})
        }
      });
    }
    return days;
  };
  const sumDaily=days=>days.reduce((acc,r)=>{
    acc.distance_km+=r.distance_km;
    acc.energy_distance_km+=r.energy_distance_km;
    acc.drive_energy_kwh+=r.drive_energy_kwh;
    acc.battery_charge_kwh+=r.battery_charge_kwh;
    acc.charge_effective_krw+=r.charge_effective_krw;
    acc.drive_soc_used_pp+=r.drive_soc_used_pp;
    acc.slow_count+=r.slow_count;
    acc.fast_count+=r.fast_count;
    acc.total_cost_krw+=r.total_cost_krw;
    for(const [k,v] of Object.entries(r.cost_categories||{})){
      acc.categories[k]=acc.categories[k]||{actual_krw:0,estimated_krw:0,effective_krw:0};
      acc.categories[k].actual_krw+=v.effective_krw;
      acc.categories[k].effective_krw+=v.effective_krw;
    }
    return acc;
  },{distance_km:0,energy_distance_km:0,drive_energy_kwh:0,battery_charge_kwh:0,charge_effective_krw:0,drive_soc_used_pp:0,slow_count:0,fast_count:0,unknown_count:0,total_cost_krw:0,categories:{}});

  const currDaily=makeDaily(ym,1);
  const prevDaily=makeDaily(pym,0.88);
  const currTotals=sumDaily(currDaily);
  currTotals.efficiency_km_kwh=currTotals.distance_km/currTotals.drive_energy_kwh;
  const prevTotals=sumDaily(prevDaily);
  prevTotals.efficiency_km_kwh=prevTotals.distance_km/prevTotals.drive_energy_kwh;

  const sampleRecords=[
    {id:'r1',kind:'charge',charge_mode:'slow',accounting_date:`${ym}-23`,started_at:`${ym}-23T18:49:00+09:00`,battery_charge_kwh:63.8,actual_krw:19800,location:{name:'집 완속 충전기'}},
    {id:'r2',kind:'charge',charge_mode:'fast',accounting_date:`${ym}-23`,started_at:`${ym}-23T17:23:00+09:00`,battery_charge_kwh:10.8,actual_krw:4200,location:{name:'고속도로 급속 충전소'}},
    {id:'r3',kind:'trip',accounting_date:`${ym}-23`,started_at:`${ym}-23T08:15:00+09:00`,distance_km:134.2,memo:'출근 및 외근'},
    {id:'r4',kind:'expense',category:'washing',accounting_date:`${ym}-05`,started_at:`${ym}-05T14:10:00+09:00`,actual_krw:10000,memo:'셀프 세차'}
  ];

  const hass={
    language:'ko',themes:{darkMode:true},user:{id:'u',is_admin:true},states:{},
    async callWS(msg){
      if(msg.type==='carrot_ha/journal/entries')return [{entry_id:'id4',title:'ID.4',fuel:'electric',is_default:true,linked:true}];
      if(msg.type.endsWith('/query')){
        const isBin=msg.from&&msg.to&&(msg.from.slice(8,10)!=='01'||msg.to.slice(8,10)!=='31')&&(new Date(msg.to)-new Date(msg.from))<5*86400000;
        if(isBin){
          return {
            record_count:4,timezone:'Asia/Seoul',has_more:false,status:{phase:'complete'},
            totals:{distance_km:263.4,battery_charge_kwh:74.5,slow_count:1,fast_count:1,unknown_count:0,total_cost_krw:26028,categories:{charging:{effective_krw:24000}}},
            records:sampleRecords
          };
        }
        return {
          record_count:sampleRecords.length,status:{phase:'complete'},timezone:'Asia/Seoul',
          records:sampleRecords,recent_records:sampleRecords,
          daily:currDaily,totals:currTotals,
          previous:{daily:prevDaily,totals:prevTotals},
          fuel_facts:null,odometer_facts:null,station_stats:[],
          comparison:{fuel:'gasoline',economy_km_l:15,sensor_entities_json:'{}'},
          fuel_price:{price:1700},fuel_sensors:{}
        };
      }
      return {};
    },
    async fetchWithAuth(){return new Response('{}',{status:404});}
  };

  class PreviewPanel extends HTMLElement{constructor(){super();this.attachShadow({mode:'open'});}}
  customElements.define('preview-journal-panel',PreviewPanel);
  const panel=document.createElement('preview-journal-panel');panel._hass=hass;
  document.getElementById('mount').append(panel);
  const {mountJournalPanel}=await import('/custom_components/carrot_ha/frontend/carrot-journal-panel-runtime.js?v='+v);
  await mountJournalPanel(panel,'0.0.0-'+v);

  // 차계부 카드가 로드된 뒤 추이 탭(#tab1)으로 이동하고, 'after' 모드에서는 스크롤 추적 패치를 preview에만 적용한다.
  const card=panel.card||panel.shadowRoot.querySelector('main > *');
  if(card){
    const waitLoaded=async()=>{for(let i=0;i<50;i++){if(!card.loading&&card.data)break;await new Promise(r=>setTimeout(r,50));}};
    await waitLoaded();
    card.$('tab1')?.click();
    if(fixMode==='after'){
      let raf=0;
      const syncOnScroll=()=>{
        if(raf)return;
        raf=requestAnimationFrame(()=>{
          raf=0;
          if(!card.trendTip||card.trendTip.hidden||!card.trendTipHit)return;
          if(!card.trendTipHit.isConnected){card.hideTrendTip();return;}
          const box=card.trendTipHit.getBoundingClientRect();
          if((box.width===0&&box.height===0)||box.bottom<0||box.top>innerHeight||box.right<0||box.left>innerWidth){
            card.hideTrendTip();
            return;
          }
          card.placeTrendTip(card.trendTipHit);
        });
      };
      window.addEventListener('scroll',syncOnScroll,{capture:true,passive:true});
      window.addEventListener('resize',syncOnScroll,{passive:true});
    }
  }
}
</script>
</body>
</html>
