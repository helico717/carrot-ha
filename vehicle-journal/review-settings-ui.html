<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>차계부 설정 UI 개선 검토 (실제 모듈 연동)</title>
<!--
  검토용 하네스: 실제 carrot-vehicle-journal.js 모듈을 그대로 불러온 뒤,
  합성 더미 데이터(mockHass)를 주입하고 설정 모달(#vehicleManageDialog)에
  개선된 UI 시안을 적용해 전체 대시보드와 함께 검증합니다.
  저장소 루트에서 실행:
    python3 -m http.server 8765
    http://localhost:8765/vehicle-journal/review-settings-ui.html
-->
<style>
  :root{--j-bg:#0b1014;--j-surface:#161e25;--j-raised:#202c36;--j-border:#2a3945;--j-ink:#f1f6fa;--j-sub:#a8bdca;--j-accent:#81e6c5}
  *{box-sizing:border-box}
  body{margin:0;background:var(--j-bg);color:var(--j-ink);font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif}
  .bar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 16px;background:#0f161c;border-bottom:1px solid var(--j-border);font-size:13px}
  .bar-left,.bar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .bar b{color:var(--j-accent)}
  .bar button{background:var(--j-raised);color:var(--j-ink);border:1px solid var(--j-border);border-radius:10px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
  .bar button:hover,.bar button.active{border-color:var(--j-accent);color:var(--j-accent);background:rgba(129,230,197,.1)}
  .bar small{color:var(--j-sub)}
  #mount{max-width:1280px;margin:0 auto;padding:12px}
  #mobileFrameWrap{display:none;justify-content:center;padding:18px 12px}
  #mobileFrame{width:390px;height:780px;border:1px solid var(--j-border);border-radius:24px;background:var(--j-bg);box-shadow:0 20px 50px rgba(0,0,0,.6)}
  body.is-embed .bar{display:none}
  body.is-embed #mount{padding:0}
</style>
</head>
<body>
<div class="bar">
  <div class="bar-left">
    <b>차계부 설정 UI 검토 (실제 대시보드 연동)</b>
    <small>실제 carrot-vehicle-journal.js + mockHass 환경입니다.</small>
  </div>
  <div class="bar-right">
    <button id="openSettings">설정 열기</button>
    <button id="viewDesktop" class="active">데스크톱</button>
    <button id="viewMobile">모바일 (390px)</button>
  </div>
</div>
<main id="mount"></main>
<div id="mobileFrameWrap"><iframe id="mobileFrame" title="모바일 390px 프리뷰"></iframe></div>

const hass = {
  states: {},
  callWS: async msg => {
    const t = msg.type || '';
    if (t.endsWith('/entries')) {
      return msg.include_deleted ? vehiclesState.map(v => ({ ...v })) : vehiclesState.filter(v => !v.deleted).map(v => ({ ...v }));
    }
    if (t.endsWith('/vehicle/update')) {
      const v = vehiclesState.find(x => x.entry_id === msg.entry_id);
      if (v) { v.title = msg.title; v.fuel = msg.fuel; v.deleted = !!msg.deleted; }
      return { ok: true };
    }
    if (t.endsWith('/user_default/set')) {
      vehiclesState.forEach(v => { v.is_default = (v.entry_id === msg.entry_id); });
      return { ok: true };
    }
    if (t.endsWith('/vehicle/delete')) {
      const idx = vehiclesState.findIndex(x => x.entry_id === msg.entry_id);
      if (idx >= 0) vehiclesState.splice(idx, 1);
      return { ok: true };
    }
    if (t.endsWith('/settings')) {
      if ('map_key' in msg) settingsState.map_key = msg.map_key;
      if ('kakao_rest_key' in msg) { settingsState.kakao_rest_key = msg.kakao_rest_key; settingsState.kakao_rest_configured = !!msg.kakao_rest_key; }
      if ('opinet_key' in msg) { settingsState.opinet_key = msg.opinet_key; settingsState.opinet_configured = !!msg.opinet_key; }
      if ('automatic_locations' in msg) settingsState.automatic_locations = !!msg.automatic_locations;
      return { ...settingsState };
    }
    if (t.endsWith('/nas/config')) {
      settingsState.backup_config = { enabled: !!msg.enabled, path: msg.path };
      if ('automatic_locations' in msg) settingsState.automatic_locations = !!msg.automatic_locations;
      return { ok: true };
    }
    if (t.endsWith('/nas/action')) {
      if (msg.action === 'run') return { ...settingsState.backup_state };
      return { status: settingsState.backup_state, objects: nasObjects };
    }
    if (t.endsWith('/charge/rates')) {
      if (msg.rates) ratesState[msg.entry_id] = { ...msg.rates };
      return ratesState[msg.entry_id] ?? null;
    }
    if (t.endsWith('/favorite/list')) {
      return favoritesState[msg.entry_id] || [];
    }
    if (t.endsWith('/favorite/rate')) {
      const list = favoritesState[msg.entry_id] || [];
      const item = list.find(x => x.id === msg.favorite_id);
      if (item) item.unit_price_krw = msg.unit_price_krw ?? null;
      return { ok: true };
    }
    if (t.endsWith('/query')) {
      return {
        totals: { distance_km: 1248, energy_kwh: 198.4, actual_krw: 118820, charging_krw: 41820, maintenance_krw: 42000, washing_krw: 35000, tuning_krw: 0, other_krw: 0, record_count: sampleRecords.length },

        record_count: sampleRecords.length,
        timezone: 'Asia/Seoul',
        has_more: false,
        status: { phase: 'complete' },
        latest: { odometer_km: 38640, soc_percent: 78 },
      };
    }
    if (t.endsWith('/map/config')) return { key: settingsState.map_key, rest_configured: true };
    return {};
  },
  fetchWithAuth: async () => new Response(new Blob(['demo']), { status: 200 }),
};

// 사이드바 아이콘 주입
const iconByNav = { vehicles: svg.car, tariffs: svg.zap, backup: svg.db, api: svg.key, status: svg.pulse };
const attachNavIcons = () => {
  sr.querySelectorAll('#settingsNav button[data-settings-nav]').forEach(btn => {
    if (btn.dataset.iconAttached) return;
    btn.dataset.iconAttached = '1';
    const key = btn.dataset.settingsNav;
    if (iconByNav[key]) btn.insertAdjacentHTML('afterbegin', iconByNav[key]);
  });
};

// 차량 관리 목록을 컴팩트 2열 그리드로 오버라이드
const origOpenMgmt = card.openVehicleManagement.bind(card);
card.openVehicleManagement = async function () {
  await origOpenMgmt();
  attachNavIcons();
  renderCompactVehicles();
  injectAutoLocIntoTariffs();
  renderRedesignedBackupPane();
  renderRedesignedApiPane();
};

// 충전 단가 탭 클릭 시에도 토글 주입 보장
sr.getElementById('settingsNav')?.addEventListener('click', e => {
  if (e.target.closest('[data-settings-nav="tariffs"]')) {
    setTimeout(injectAutoLocIntoTariffs, 50);
  }
});

function renderCompactVehicles() {
  const host = sr.getElementById('vehicleManageList');
  if (!host || !card.managedVehicles) return;
  const active = card.managedVehicles.filter(v => !v.deleted);
  const trashed = card.managedVehicles.filter(v => v.deleted);
  const makeCard = v => {
    const fm = fuelMap[v.fuel] || fuelMap.electric;
    return `
      <div class="v-card-new ${v.deleted ? 'trashed' : ''}" data-v="${v.entry_id}">
        <div class="v-top">
          <div class="v-id-wrap">
            <div class="fuel-badge ${fm.cls}">${fm.icon}</div>
            <div>
              <div style="font-weight:800;font-size:15.5px">${v.title}</div>
              <div style="font-size:12px;color:var(--j-sub)">${fm.label}${v.deleted ? ' · 휴지통' : ''}</div>
            </div>
          </div>
          ${!v.deleted ? `<button type="button" class="${v.is_default ? 'btn-gold-pill' : ''}" data-act="default">${v.is_default ? `${svg.starFilled} 기본` : `${svg.starOutline} 기본`}</button>` : ''}
        </div>
        <div class="v-actions-row">
          ${!v.deleted ? `
            <button type="button" data-act="toggle-edit">이름 · 유종 수정</button>
            <button type="button" data-act="trash">휴지통</button>
          ` : `
            <button type="button" data-act="restore">차량 복원</button>
            ${!v.linked ? `<button type="button" class="vehicle-delete" data-act="delete">영구 삭제</button>` : ''}
          `}
        </div>
        <div class="v-edit-box" hidden>
          <label>차량 이름<input data-t value="${v.title}"></label>
          <label>유종<select data-f>${Object.entries(fuelMap).map(([k, m]) => `<option value="${k}" ${k === v.fuel ? 'selected' : ''}>${m.label}</option>`).join('')}</select></label>
          <div style="display:flex;justify-content:flex-end;gap:6px">
            <button type="button" data-act="cancel-edit">취소</button>
            <button type="button" class="btn-mint" data-act="save">변경 저장</button>
          </div>
        </div>
      </div>`;
  };
  host.innerHTML = `<div class="v-grid-2">${active.map(makeCard).join('')}</div>` +
    (trashed.length ? `<div style="margin:16px 0 8px;font-size:12px;color:var(--j-sub);font-weight:700">휴지통 (${trashed.length})</div><div class="v-grid-2">${trashed.map(makeCard).join('')}</div>` : '');
  host.onclick = async e => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const box = btn.closest('[data-v]');
    const id = box.dataset.v;
    const v = card.managedVehicles.find(x => x.entry_id === id);
    const act = btn.dataset.act;
    if (act === 'toggle-edit' || act === 'cancel-edit') {
      box.querySelector('.v-edit-box').hidden = (act === 'cancel-edit') ? true : !box.querySelector('.v-edit-box').hidden;
    } else if (act === 'default') {
      await hass.callWS({ type: 'carrot_ha/journal/user_default/set', entry_id: id });
      await card.openVehicleManagement();
    } else if (act === 'save') {
      await hass.callWS({ type: 'carrot_ha/journal/vehicle/update', entry_id: id, title: box.querySelector('[data-t]').value, fuel: box.querySelector('[data-f]').value, deleted: false });
      await card.openVehicleManagement();
    } else if (act === 'trash' || act === 'restore') {
      await hass.callWS({ type: 'carrot_ha/journal/vehicle/update', entry_id: id, title: v.title, fuel: v.fuel, deleted: act === 'trash' });
      await card.openVehicleManagement();
    } else if (act === 'delete') {
      await hass.callWS({ type: 'carrot_ha/journal/vehicle/delete', entry_id: id, confirm: true });
      await card.openVehicleManagement();
    }
  };
}

function injectAutoLocIntoTariffs() {
  const autoCheck = sr.getElementById('automaticLocations');
  const origLabel = autoCheck?.closest('label');
  if (origLabel) origLabel.hidden = true;
  const tariffPane = sr.getElementById('favoriteTariffPane');
  if (!tariffPane || tariffPane.querySelector('#movedAutoLocCard')) return;
  const switchCard = document.createElement('label');
  switchCard.id = 'movedAutoLocCard';
  switchCard.className = 'j-switch-card';
  switchCard.innerHTML = `
    <div>
      <div style="font-weight:750;font-size:14px">충전 · 주유 장소 자동 선택</div>
      <div style="font-size:12px;color:var(--j-sub);margin-top:2px">자주 가는 충전소·주유소 반경 내 기록 시 장소 이름을 자동으로 연결해요.</div>
    </div>
    <span class="j-switch"><input type="checkbox" id="movedAutoLocInput" ${settingsState.automatic_locations ? 'checked' : ''}><span class="j-slider"></span></span>
  `;
  const heading = tariffPane.querySelector('.tariff-heading');
  heading?.insertAdjacentElement('afterend', switchCard);
  switchCard.querySelector('#movedAutoLocInput').onchange = async e => {
    await hass.callWS({ type: 'carrot_ha/journal/settings', automatic_locations: e.target.checked });
    sr.getElementById('vehicleManageError').textContent = '장소 자동 선택 설정을 변경했어요.';
  };
}

  document.getElementById('mobileFrameWrap').style.display = 'none';
  e.target.classList.add('active');
  document.getElementById('viewMobile').classList.remove('active');
};
document.getElementById('viewMobile').onclick = e => {
  document.getElementById('mount').style.display = 'none';
  const wrap = document.getElementById('mobileFrameWrap');
  const frame = document.getElementById('mobileFrame');
  wrap.style.display = 'flex';
  if (!frame.src) frame.src = location.pathname + '?embed=1';
  e.target.classList.add('active');
  document.getElementById('viewDesktop').classList.remove('active');
};

setTimeout(() => card.openVehicleManagement(), 500);
</script>
</body>
</html>
