<main class="shell" id="app"><header class="mast"><div><div class="brand">VOLKSWAGEN · CARROT HA</div><h1>ID.4 PRO <span class="mini-label">/ 내 차의 생활</span></h1></div><div class="row"><span class="badge good">● 주차 중</span><span class="date">2026년 10월 · 샘플</span><button data-record class="primary">+ 기록 남기기</button></div></header><nav class="tabs" role="tablist" aria-label="차계부 메뉴"></nav><div class="concept"><strong id="conceptTitle"></strong><p id="conceptDescription"></p></div><section id="content" role="tabpanel"></section><footer class="footer"><span>모든 수치는 디자인용 샘플이에요. 차량·HA와 연결하지 않아요.</span><span>직접 남긴 기록은 이 브라우저에만 저장해요.</span></footer></main>
<div class="dialog-bg" id="recordDialog" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="recordHeading"><div class="row spaced"><h2 id="recordHeading">차에 해준 일을 기록해요.</h2><button data-close aria-label="닫기">✕</button></div><form id="recordForm"><div class="fields"><label>어떤 작업인가요?<select name="category"><option>타이어</option><option>와이퍼</option><option>워셔액</option><option>소모품 교체</option><option>일반 정비</option><option>튜닝</option><option>세차</option><option>기타</option></select></label><label>작업 일자<input name="date" type="date" required value="2026-10-06"></label><label>지출 금액 (원)<input name="amount" type="number" min="1" max="100000000" step="1" required placeholder="예: 35000"></label><label>사진 첨부<input id="photo" type="file" accept="image/png,image/jpeg,image/webp"><small>2MB 이하 사진을 골라 주세요.</small></label><div class="fullfield" id="preview"></div><label class="fullfield">메모<textarea name="memo" rows="3" maxlength="500" placeholder="어떤 작업을 했는지 남겨요."></textarea></label></div><p class="error" id="recordError" role="alert"></p><p class="mini-label" style="margin-bottom:15px">후보 비교용 로컬 저장이에요. 첫 번째 프로토타입의 기록과 별도로 보관해요.</p><button class="primary" type="submit">기록 저장하기</button></form></section></div><div class="toast" id="toast" role="status" aria-live="polite"></div>

(()=>{'use strict';const $=s=>document.querySelector(s),fmt=n=>Math.round(n).toLocaleString('ko-KR'),won=n=>fmt(n)+'원',escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const variants=[['brief','오늘의 브리핑','차량 상태와 이번 달 핵심 결론을 먼저 읽어요.'],['unit','1km의 가격','거리당 비용으로 전기차의 경제성을 이해해요.'],['calendar','생활 캘린더','언제 달리고, 충전하고, 관리했는지 날짜로 찾아요.'],['flow','에너지의 여정','충전한 전기가 거리와 비용으로 이어지는 흐름을 보여줘요.'],['ledger','월간 명세서','자동 충전비와 직접 기록한 비용을 투명하게 합산해요.'],['compare','두 개의 차고','같은 거리를 달린 두 차량의 비용을 나란히 비교해요.'],['story','한 달의 이야기','숫자를 읽기 쉬운 문장과 짧은 챕터로 풀어요.'],['care','오래 함께하기','차량 관리와 다음에 챙길 일을 우선해서 보여줘요.'],['explorer','패턴 탐색','지표·기간·비용 항목을 선택하며 내 차를 이해해요.'],['quiet','조용한 대시보드','큰 질문과 짧은 답만 남기고 상세는 펼쳐 봐요.']];
const tabs=['한눈에','주행 & 에너지','절약 비교','차계부','차량 상태'];let variant=0,tab=0,day=4,fuel='gas',economy=12,metric='distance',period='week',category='충전비',photo=null,focusReturn=null;
const distance=1248,energy=240,charge=92000,prices={gas:1725,diesel:1560,premium:1950},fuelNames={gas:'휘발유',diesel:'경유',premium:'고급유'};let records=[{category:'와이퍼',date:'2026-10-04',amount:45000,memo:'앞유리 와이퍼를 교체했어요.'},{category:'튜닝',date:'2026-10-02',amount:36000,memo:'트렁크 정리함을 장착했어요.'},{category:'세차',date:'2026-10-01',amount:22000,memo:'주말에 세차했어요.'},{category:'기타',date:'2026-10-03',amount:8000,memo:'주차비를 기록했어요.'}];
try{const r=JSON.parse(localStorage.getItem('ev-zero-records'));if(Array.isArray(r))records=r.filter(x=>x&&Number.isFinite(x.amount)&&x.amount>0&&typeof x.date==='string'&&typeof x.category==='string').map(x=>({...x,memo:String(x.memo||'')}));}catch{}
const month=()=>records.filter(r=>r.date.startsWith('2026-10')),manual=()=>month().reduce((s,r)=>s+r.amount,0),total=()=>charge+manual(),ice=()=>distance/economy*prices[fuel],saving=()=>ice()-charge;
const panel=(cls,html)=>'<article class="panel '+cls+'">'+html+'</article>',label=t=>'<div class="kicker">'+t+'</div>',value=(v,u='')=>'<div class="big">'+v+(u?' <span class="unit">'+u+'</span>':'')+'</div>',stat=(name,v,note='')=>'<div class="stat"><small>'+name+'</small><strong>'+v+'</strong><small>'+note+'</small></div>';
function breakdown(){const a={'충전비':charge,'정비 / 소모품':0,'튜닝':0,'세차':0,'기타':0};month().forEach(r=>a[['튜닝','세차','기타'].includes(r.category)?r.category:'정비 / 소모품']+=r.amount);return a;}
function costs(){const a=breakdown();return '<div class="allocation" role="img" aria-label="카테고리별 지출 비중">'+Object.values(a).map(v=>'<span style="flex:'+v+'" title="'+won(v)+'"></span>').join('')+'</div><div class="category-list">'+Object.entries(a).map(([k,v])=>'<div><small>'+k+'</small><strong>'+won(v)+'</strong></div>').join('')+'</div>';}

function recent(){return month().slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3).map(r=>'<div class="list-row"><div><strong>'+escape(r.category)+'</strong><small>'+escape(r.date)+' · '+escape(r.memo)+'</small></div><strong>'+won(r.amount)+'</strong></div>').join('');}
function care(){return '<div class="care-item"><span class="badge good">최근 완료했어요.</span><h3>앞유리 와이퍼를 교체했어요.</h3><small>10월 4일 · 45,000원 · 기록 예시</small></div><div class="care-item"><span class="badge">계획 예시</span><h3>타이어 공기압을 확인해 볼까요?</h3><p class="mini-label">최근 측정 정보가 없어 실제 이상 여부는 알 수 없어요.</p><div class="row"><button data-plan>점검했다고 표시하기</button></div></div><div class="care-item"><h3>워셔액을 보충할 때 기록해 주세요.</h3><small>교체 주기를 판단할 기록이 아직 부족해요.</small></div>';}

function calendar(){const names=['월','화','수','목','금','토','일'];return '<div class="calendar">'+names.map(n=>'<span class="dayname">'+n+'</span>').join('')+'<span></span><span></span><span></span>'+Array.from({length:31},(_,i)=>{const d=i+1,has=[1,2,3,4,6].includes(d);return '<button data-day="'+d+'" '+(has?'data-cost="true"':'')+' data-mark="'+(has?'·':'')+'" class="'+(day===d?'selected':'')+'" aria-pressed="'+(day===d)+'" aria-label="10월 '+d+'일 '+(has?'기록 있어요.':'기록 없어요.')+'">'+d+'</button>';}).join('')+'</div><div class="calendar-detail" id="dayDetail" aria-live="polite"></div>';}
function summary(){switch(variants[variant][0]){
case 'brief':return panel('wide hero',label('YOUR MONTH, IN ONE SENTENCE')+'<h1>1,248km를 달리고,<br><span class="accent">'+won(saving())+'</span>을 아꼈어요.</h1><p class="muted" style="margin-top:18px">주행은 자동으로 모으고, 관리한 일은 가볍게 남겨요.</p><div class="stats">'+stat('차량 총 지출',won(total()))+stat('평균 전비','5.2km/kWh')+stat('1km당 충전비',won(charge/distance))+'</div><div class="row" style="margin-top:25px"><button data-goto="2">절약 계산 살펴보기 →</button></div>')+panel('narrow',battery())+panel('half','<h2>어디에 썼을까요?</h2>'+costs())+panel('half','<div class="row spaced"><h2>최근에 챙긴 일이에요.</h2><button data-record>+ 기록</button></div>'+recent());
case 'unit':return panel('wide hero blue',label('THE PRICE OF A KILOMETER')+'<h1>1km를 달리는 데</h1>'+value(fmt(charge/distance),'원이 들었어요.')+'<p>비교 차량은 같은 거리에 '+won(ice()/distance)+'이 필요해요.</p>'+rail()+'<div class="row" style="margin-top:26px"><button data-goto="2">비교 차량 바꾸기 →</button></div>')+panel('narrow','<h2>작은 비용의 기준이에요.</h2><div class="list-row"><span>충전 단가</span><strong>383원/kWh</strong></div><div class="list-row"><span>100km 충전비</span><strong>'+won(charge/distance*100)+'</strong></div><div class="list-row"><span>100km 비교 유류비</span><strong>'+won(ice()/distance*100)+'</strong></div><p class="stat-note">충전비만 비교해요. 정비비나 보험료는 제외해요.</p>')+panel('third',label('DISTANCE')+value('1,248','km')+'<small>이번 달 함께 이동했어요.</small>')+panel('third',label('CHARGING')+value('92,000','원')+'<small>8번의 충전을 자동 집계했어요.</small>')+panel('third',label('ALL EXPENSES')+value(fmt(total()),'원')+'<small>직접 기록한 관리 비용도 포함해요.</small>');
case 'calendar':return panel('wide','<div class="row spaced"><h2>차와 함께한 10월이에요.</h2><span class="badge">날짜를 눌러보세요.</span></div>'+calendar())+panel('narrow hero',label('MONTHLY SNAPSHOT')+value(fmt(total()),'원')+'<small>이번 달 차량 총 지출이에요.</small><div class="divider"></div>'+stat('달린 거리','1,248km')+stat('충전비','92,000원')+stat('절약한 유류비',won(saving()))+'<button data-record style="margin-top:20px">이날의 작업 기록하기</button>')+panel('full','<h2>읽기 쉬운 생활 기록이에요.</h2><div class="timeline"><div class="event"><small>10월 4일 · 관리</small><h3>와이퍼를 교체했어요.</h3><p class="muted">비 오는 날 시야를 위한 작은 준비예요.</p></div><div class="event"><small>10월 2일 · 꾸미기</small><h3>트렁크 정리함을 장착했어요.</h3></div><div class="event"><small>10월 1일 · 세차</small><h3>깨끗하게 새달을 시작했어요.</h3></div></div>');
case 'flow':return panel('full hero',label('ENERGY → DISTANCE → COST')+'<h1>충전한 전기는 어디로 갔을까요?</h1><div class="journey"><div class="node"><small>충전한 전력</small><strong>240kWh</strong><small>8번의 충전</small></div><span class="arrow">→</span><div class="node"><small>함께 달린 거리</small><strong>1,248km</strong><small>평균 5.2km/kWh</small></div><span class="arrow">→</span><div class="node"><small>충전 비용</small><strong>92,000원</strong><small>1km당 약 74원</small></div></div><p class="muted">이 예시에서는 충전량과 소비량을 240kWh로 가정해요. 실제 집계에서는 충전 손실과 배터리 잔량 차이를 구분해요.</p>')+panel('half','<h2>같은 이동을 휘발유로 했다면</h2>'+value(fmt(ice()),'원')+'<p class="muted">12km/L 비교 차량의 예상 유류비예요.</p><div class="divider"></div><h3 class="accent">전기로 달려 '+won(saving())+'을 아꼈어요.</h3><button data-goto="2" style="margin-top:18px">내 조건으로 계산해 보기</button>')+panel('half','<h2>차를 돌보는 비용도 있어요.</h2>'+expenseRows());
case 'ledger':return panel('half receipt',label('CARROT / OCTOBER STATEMENT')+'<h2>이번 달 차량 명세서예요.</h2>'+expenseRows()+'<div class="divider"></div><div class="row spaced"><span>합계</span><strong class="medium">'+won(total())+'</strong></div><small>충전비 + 직접 기록한 지출</small>')+panel('half',label('BEHIND THE TOTAL')+'<h2>비용을 맥락과 함께 읽어요.</h2><div class="stats two">'+stat('주행거리','1,248km')+stat('총 지출 / 주행거리',won(total()/distance)+'/km')+'</div><div class="divider"></div><h3>충전비를 따로 보면</h3>'+rail()+'<p class="stat-note">전체 지출의 거리당 비용과 충전비의 거리당 비용을 구분해요.</p><div class="row" style="margin-top:25px"><button data-goto="3">모든 기록 보기</button><button data-record class="primary">새 지출 남기기</button></div>')+panel('full','<h2>기록이 합계의 근거가 돼요.</h2>'+recent());
case 'compare':return panel('full hero',label('TWO GARAGES, SAME DISTANCE')+'<h1>같은 1,248km.<br>비용은 이렇게 달라요.</h1><div class="compare-pair"><div><small>내 차고 · ID.4</small><strong>92,000원</strong><p class="muted">전기로 달렸어요.</p></div><div><small>비교 차고 · '+fuelNames[fuel]+'</small><strong>'+won(ice())+'</strong><p class="muted">연비 '+economy+'km/L를 가정해요.</p></div></div><h2 class="accent">'+(saving()>=0?won(saving())+'을 아꼈어요.':won(-saving())+'이 더 들었어요.')+'</h2><button data-goto="2" style="margin-top:22px">유종과 연비를 바꿔볼까요? →</button>')+panel('half','<h2>실제 낸 돈을 살펴봐요.</h2>'+costs())+panel('half','<h2>비교에 사용한 기준이에요.</h2><div class="list-row"><span>이번 달 주행거리</span><strong>1,248km</strong></div><div class="list-row"><span>샘플 유가</span><strong>'+won(prices[fuel])+'/L</strong></div><div class="list-row"><span>충전 비용</span><strong>92,000원</strong></div><small>유류비만 비교하며 전체 보유 비용의 차이는 아니에요.</small>');
case 'story':return panel('full editorial',label('THE OCTOBER EDITION')+'<h1>이번 달, 내 차와<br><em>1,248km의 이야기</em>를 썼어요.</h1><p class="muted" style="margin-top:20px">8번 충전했고, 이동에 92,000원을 썼어요.<br>평균 5.2km/kWh로 달리며 비교 차량보다 '+won(saving())+'을 아꼈어요.</p>')+panel('third','<div class="chapter">CHAPTER / 이동</div><h2>100km에 약<br>'+won(charge/distance*100)+'이면 돼요.</h2><div class="bubbles"><div class="bubble">전비<strong>5.2</strong></div><div class="bubble">충전<strong>8회</strong></div></div><button data-goto="1" style="margin-top:20px">주행을 더 살펴봐요</button>')+panel('third','<div class="chapter">CHAPTER / 지출</div><h2>차를 위해<br>'+won(total())+'을 썼어요.</h2>'+costs())+panel('third','<div class="chapter">CHAPTER / 돌봄</div><h2>작은 관리도<br>기억하고 있어요.</h2>'+recent()+'<button data-record style="margin-top:15px">새 이야기를 남겨요</button>');
case 'care':return panel('wide','<div class="row spaced"><h2>오래 함께하기 위한 기록이에요.</h2><button data-record class="primary">+ 관리 기록</button></div>'+care())+panel('narrow hero',label('CARE, NOT GUESSWORK')+'<h2>기록이 쌓이면<br>다음 관리가 쉬워져요.</h2>'+value(fmt(manual()),'원')+'<p class="muted">이번 달 직접 기록한 관리·기타 지출이에요.</p><div class="divider"></div>'+stat('누적 주행거리','28,416km')+stat('이번 달 주행거리','1,248km')+'<p class="stat-note">교체 권장 시점은 실제 기록과 차량 제조사 기준이 있어야 판단해요.</p>')+panel('half',battery())+panel('half','<h2>유지비를 함께 챙겨요.</h2>'+costs()+'<div class="divider"></div><span class="accent">유류비는 '+won(saving())+'을 절약했어요.</span>');
case 'explorer':return panel('wide','<h2>내 차의 패턴을 찾아봐요.</h2>'+trendControls()+'<svg class="line-chart" id="trend" role="img" aria-label="선택한 지표의 기간별 추이"></svg><div class="stat-note" id="trendNote" aria-live="polite"></div>')+panel('narrow',label('SELECT & UNDERSTAND')+'<h2>수치를 함께 읽어요.</h2>'+stat('총 주행거리','1,248km')+'<div class="divider"></div>'+stat('평균 전비','5.2km/kWh')+'<div class="divider"></div>'+stat('충전비','92,000원'))+panel('full','<h2>무엇에 썼는지 골라보세요.</h2><div class="cost-stack">'+Object.entries(breakdown()).map(([k,v])=>'<button data-category="'+k+'" aria-pressed="'+(k===category)+'">'+k+'<strong>'+won(v)+'</strong></button>').join('')+'</div><div class="answer" id="categoryDetail" aria-live="polite"></div>');
case 'quiet':return panel('full hero',label('JUST WHAT YOU NEED')+'<h1>이번 달은<br><span class="accent">'+won(saving())+'</span>만큼 가벼워졌어요.</h1><p class="muted" style="margin-top:18px">1,248km를 달리고 충전비 92,000원을 썼어요.</p>')+panel('wide','<h2>궁금한 것만 펼쳐 봐요.</h2>'+[['얼마나 썼나요?',won(total()),costs()],['잘 달리고 있나요?','5.2km/kWh','<p>1,248km를 달리는 데 샘플 전력 240kWh를 사용했어요.</p>'],['최근에 무엇을 관리했나요?','와이퍼 교체',recent()],['차는 지금 어떤가요?','주차 중',battery()]].map(([q,a,html],i)=>'<button class="question" data-question="'+i+'" aria-expanded="false" aria-controls="answer'+i+'"><span>'+q+'</span><strong>'+a+' ＋</strong></button><div class="answer" id="answer'+i+'" hidden>'+html+'</div>').join(''))+panel('narrow','<h2>기록은 간단하게 남겨요.</h2><p class="muted" style="margin:18px 0">작업 날짜와 금액만 있어도 시작할 수 있어요. 사진과 메모는 필요할 때 더해요.</p><button data-record class="primary">+ 기록 남기기</button><div class="divider"></div><small>비교 기준</small><p>'+fuelNames[fuel]+' '+won(prices[fuel])+'/L<br>연비 '+economy+'km/L</p><button data-goto="2" style="margin-top:20px">계산 기준 바꾸기</button>');}}
function trendControls(){return '<div class="controls" aria-label="지표">'+[['distance','주행거리'],['energy','전력 소비'],['efficiency','평균 전비'],['charge','충전비'],['maintenance','관리비']].map(([k,n])=>'<button data-metric="'+k+'" aria-pressed="'+(metric===k)+'">'+n+'</button>').join('')+'</div><div class="controls" aria-label="기간">'+[['day','1일'],['week','1주일'],['month','1개월']].map(([k,n])=>'<button data-period="'+k+'" aria-pressed="'+(period===k)+'">'+n+'</button>').join('')+'</div>';}
function driving(){return panel('full hero blue',label('DISTANCE & ENERGY')+'<h1>주행을 비용과 함께 이해해요.</h1><div class="stats">'+stat('주행거리','1,248km')+stat('전력 소비','240kWh')+stat('평균 전비','5.2km/kWh')+'</div>')+panel('wide','<h2>변화의 흐름을 살펴봐요.</h2>'+trendControls()+'<svg class="line-chart" id="trend" role="img" aria-label="기간별 추이"></svg><div class="stat-note" id="trendNote" aria-live="polite"></div>')+panel('narrow','<h2>충전이 이동을 준비해요.</h2><div class="list-row"><span>충전 횟수</span><strong>8회</strong></div><div class="list-row"><span>충전량</span><strong>240kWh</strong></div><div class="list-row"><span>충전비</span><strong>92,000원</strong></div><div class="list-row"><span>평균 단가</span><strong>383원/kWh</strong></div><p class="stat-note">기간별 추이는 샘플이에요. 관리비의 일별 값에는 새 기록을 반영해요.</p>');}
function compare(){return panel('wide hero',label('SAME ROAD, DIFFERENT COST')+'<h1 id="savingHeading">'+(saving()>=0?'이번 달에 아꼈어요.':'비교 차량보다 더 들었어요.')+'</h1><div id="savingValue">'+value(fmt(Math.abs(saving())),'원')+'</div><div class="compare-pair"><div><small>내 전기차</small><strong>92,000원</strong></div><div><small>비교 내연기관</small><strong id="iceCost">'+won(ice())+'</strong></div></div><div id="compareRail">'+rail()+'</div><p class="stat-note">충전 비용과 예상 유류비만 비교해요.</p>')+panel('narrow','<h2>내가 비교할 조건이에요.</h2><div class="fields"><label class="fullfield">비교 유종<select id="fuel"><option value="gas">휘발유</option><option value="diesel">경유</option><option value="premium">고급유</option></select></label><label class="fullfield">비교 연비 (km/L)<input id="economy" type="number" min="1" max="50" step="0.1" value="'+economy+'"></label></div><p id="compareError" class="error" role="alert"></p><div class="list-row"><span>전국 평균 유가 · 샘플</span><strong id="price">'+won(prices[fuel])+'/L</strong></div><small>HA 유가 센서를 연결하기 전의 예시예요.</small><div class="divider"></div><small>예상 유류비 계산</small><p>1,248km ÷ 연비 × 유가예요.</p>')+panel('full','<h2>절약액과 차량 총 지출은 구분해요.</h2><div class="stats">'+stat('충전비',won(charge),'유류비 비교에 사용해요.')+stat('직접 기록한 지출',won(manual()),'관리·튜닝·세차 등을 포함해요.')+stat('차량 총 지출',won(total()),'실제로 쓴 합계예요.')+'</div>');}
function ledger(){return panel('narrow receipt',label('MONTHLY TOTAL')+value(fmt(total()),'원')+expenseRows())+panel('wide','<div class="row spaced"><h2>차에 남긴 기록이에요.</h2><button data-record class="primary">+ 기록 남기기</button></div><table class="table"><thead><tr><th>날짜</th><th>작업 / 메모</th><th>금액</th></tr></thead><tbody>'+records.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r=>'<tr><td>'+escape(r.date)+'</td><td><strong>'+escape(r.category)+'</strong><br><small>'+escape(r.memo)+'</small>'+(r.photo?'<details><summary>첨부 사진 보기</summary><img class="preview" alt="작업 사진" src="'+escape(r.photo)+'"></details>':'')+'</td><td>'+won(r.amount)+'</td></tr>').join('')+'</tbody></table><button id="export" style="margin-top:20px">기록 JSON 내려받기</button><p class="stat-note">요약은 2026년 10월 기록만 합산해요. 목록에는 전체 기록을 보여줘요.</p>');}
function vehicle(){return panel('full hero blue',battery())+panel('half','<h2>내 차의 마지막 측정값이에요.</h2>'+[['누적 주행거리','28,416km'],['실내 온도','22°C'],['외기 온도','20°C'],['12V 배터리','12.5V']].map(([k,v])=>'<div class="list-row"><span>'+k+'</span><strong>'+v+'</strong></div>').join(''))+panel('half','<h2>측정 시각을 함께 확인해요.</h2><p class="muted" style="margin-top:20px">이 화면은 실제 텔레메트리와 연결되지 않은 샘플이에요. 실제 서비스에서는 마지막 차량 측정 시각과 서버 확인 시각을 따로 표시해요.</p><div class="divider"></div><p>주행이 시작되면 카메라 모니터링을 종료하는 기존 안전 동작을 유지해요.</p>');}
function render(){const d=variants[variant];$('#app').className='shell theme-'+d[0];$('#conceptTitle').textContent=tab===0?d[1]:tabs[tab];$('#conceptDescription').textContent=tab===0?d[2]:'선택한 디자인의 상세 화면이에요.';$('#content').setAttribute('aria-labelledby','tab'+tab);document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(+b.dataset.tab===tab)));$('#content').innerHTML='<div class="grid">'+(tab===0?summary():tab===1?driving():tab===2?compare():tab===3?ledger():vehicle())+'</div>';if($('#trend'))drawTrend();if($('#dayDetail'))updateDay();if($('#categoryDetail'))updateCategory();if($('#fuel')){$('#fuel').value=fuel;$('#fuel').onchange=e=>{fuel=e.target.value;updateCompare();};$('#economy').oninput=updateCompare;}if($('#export'))$('#export').onclick=exportRecords;}
function select(i){variant=(i+10)%10;$('#candidate').value=variants[variant][0];$('#count').textContent=(variant+1)+' / 10';render();}
$('#candidate').innerHTML=variants.map(v=>'<option value="'+v[0]+'">'+v[1]+'</option>').join('');$('#candidate').onchange=()=>select(variants.findIndex(v=>v[0]===$('#candidate').value));$('#prev').onclick=()=>select(variant-1);$('#next').onclick=()=>select(variant+1);$('.tabs').innerHTML=tabs.map((t,i)=>'<button id="tab'+i+'" role="tab" aria-selected="'+(i===0)+'" aria-controls="content" data-tab="'+i+'">'+t+'</button>').join('');$('.tabs').onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();tab=e.key==='Home'?0:e.key==='End'?4:(tab+(e.key==='ArrowRight'?1:4))%5;render();$('#tab'+tab).focus();}};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab!==undefined){tab=+b.dataset.tab;render();}if(b.dataset.goto!==undefined){tab=+b.dataset.goto;render();}if(b.hasAttribute('data-record'))openRecord();if(b.dataset.day){day=+b.dataset.day;document.querySelectorAll('[data-day]').forEach(x=>{x.classList.toggle('selected',+x.dataset.day===day);x.setAttribute('aria-pressed',+x.dataset.day===day);});updateDay();}if(b.dataset.metric){metric=b.dataset.metric;document.querySelectorAll('[data-metric]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.metric===metric));drawTrend();}if(b.dataset.period){period=b.dataset.period;document.querySelectorAll('[data-period]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.period===period));drawTrend();}if(b.dataset.category){category=b.dataset.category;document.querySelectorAll('[data-category]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.category===category));updateCategory();}if(b.dataset.question!==undefined){const answer=$('#answer'+b.dataset.question);answer.hidden=!answer.hidden;b.setAttribute('aria-expanded',!answer.hidden);}if(b.hasAttribute('data-plan')){b.textContent='이번 화면에서 확인했어요.';b.disabled=true;toast('점검 완료 표시의 예시예요. 관리 이력은 기록하기로 남겨 주세요.');}if(b.hasAttribute('data-close'))closeRecord();});
function updateDay(){const date='2026-10-'+String(day).padStart(2,'0'),r=records.filter(x=>x.date===date);$('#dayDetail').innerHTML='<small>10월 '+day+'일</small><h3>'+([1,2,3,4,6].includes(day)?[0,42,35,18,26,0,51][day]+'km를 달렸어요.':'주행 정보가 없는 날이에요.')+'</h3>'+r.map(x=>'<div class="list-row"><span>'+escape(x.category)+'<small>'+escape(x.memo)+'</small></span><strong>'+won(x.amount)+'</strong></div>').join('')+(!r.length?'<small>직접 남긴 지출 기록은 없어요.</small>':'');}
function updateCategory(){const a=breakdown();$('#categoryDetail').innerHTML='<strong>'+category+' · '+won(a[category])+'</strong><p class="mini-label" style="margin-top:8px">'+(category==='충전비'?'충전 센서에서 자동으로 모으는 비용이에요. 지금은 샘플이에요.':category==='정비 / 소모품'?'타이어·와이퍼·워셔액·일반 정비 기록을 함께 모았어요.':'직접 남긴 '+category+' 기록을 모았어요.')+'</p>';}
function updateCompare(){const v=+$('#economy').value;if(!$('#economy').value||v<1||v>50){$('#compareError').textContent='연비는 1~50km/L로 입력해 주세요.';return;}economy=v;$('#compareError').textContent='';$('#savingHeading').textContent=saving()>=0?'이번 달에 아꼈어요.':'비교 차량보다 더 들었어요.';$('#savingValue').innerHTML=value(fmt(Math.abs(saving())),'원');$('#iceCost').textContent=won(ice());$('#price').textContent=won(prices[fuel])+'/L';$('#compareRail').innerHTML=rail();}
function drawTrend(){const svg=$('#trend');if(!svg)return;const w=Math.max(260,svg.getBoundingClientRect().width),h=210,l=65,r=20,t=25,b=36,labels=period==='day'?['10/1','10/2','10/3','10/4','10/5','10/6']:period==='week'?['9/1주','9/2주','9/3주','9/4주','10/1주']:['5월','6월','7월','8월','9월','10월'];const names={distance:['주행거리','km'],energy:['전력 소비','kWh'],efficiency:['평균 전비','km/kWh'],charge:['충전비','원'],maintenance:['관리비','원']},base={distance:1248,energy:240,efficiency:5.2,charge:92000,maintenance:manual()};let vals=[.78,.91,.86,1.04,.95,1];if(labels.length===5)vals=[.7,.9,.82,1.03,1];vals=vals.map(v=>v*base[metric]*(metric==='efficiency'?1:period==='day'?.16:period==='week'?.25:1));if(metric==='maintenance'&&period==='day')vals=Array.from({length:6},(_,i)=>month().filter(x=>x.date==='2026-10-0'+(i+1)).reduce((s,x)=>s+x.amount,0));const max=Math.max(1,...vals)*1.2,pw=w-l-r,ph=h-t-b,points=vals.map((v,i)=>({x:l+i*pw/(vals.length-1),y:t+ph*(1-v/max)}));let html='<title>'+names[metric][0]+' 기간별 샘플 추이</title><text x="8" y="14">'+names[metric][1]+'</text>';for(let i=0;i<4;i++){const y=t+ph*i/3;html+='<line x1="'+l+'" x2="'+(w-r)+'" y1="'+y+'" y2="'+y+'" stroke="var(--border)"/><text x="'+(l-8)+'" y="'+(y+4)+'" text-anchor="end">'+(metric==='charge'||metric==='maintenance'?fmt(max*(1-i/3)/1000)+'천':(max*(1-i/3)).toFixed(metric==='efficiency'?1:0))+'</text>';}
const path=points.map((p,i)=>(i?'L':'M')+p.x+','+p.y).join(' '),area=path+' L'+points.at(-1).x+','+(h-b)+' L'+l+','+(h-b)+' Z';html+='<path d="'+area+'" fill="var(--a)" opacity=".09"/><path d="'+path+'" fill="none" stroke="var(--a)" stroke-width="3"/>';points.forEach((p,i)=>{html+='<circle cx="'+p.x+'" cy="'+p.y+'" r="4" fill="var(--a)"/><rect data-sample="'+i+'" x="'+(p.x-15)+'" y="'+t+'" width="30" height="'+ph+'" fill="transparent"><title>'+labels[i]+' '+vals[i].toFixed(1)+' '+names[metric][1]+'</title></rect>';if(w>420||i%2===0)html+='<text x="'+p.x+'" y="'+(h-9)+'" text-anchor="'+(i===0?'start':i===points.length-1?'end':'middle')+'">'+labels[i]+'</text>';});svg.setAttribute('viewBox','0 0 '+w+' '+h);svg.innerHTML=html;$('#trendNote').textContent=names[metric][0]+' · '+(metric==='maintenance'&&period==='day'?'직접'+' 기록을 반영해요.':'샘플 추이예요.')+' 선 위를 눌러 값을 확인해요.';svg.onclick=e=>{const hit=e.target.closest('[data-sample]');if(hit){const i=+hit.dataset.sample;$('#trendNote').textContent=labels[i]+' · '+names[metric][0]+' '+vals[i].toLocaleString('ko-KR',{maximumFractionDigits:1})+' '+names[metric][1]+'이에요.';}};}
function toast(s){$('#toast').textContent=s;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').textContent='',4500);}function openRecord(){focusReturn=document.activeElement;$('#recordDialog').hidden=false;$('#recordForm select').focus();}function closeRecord(){$('#recordDialog').hidden=true;focusReturn?.focus();}$('#recordDialog').onclick=e=>{if(e.target===$('#recordDialog'))closeRecord();};document.addEventListener('keydown',e=>{if($('#recordDialog').hidden)return;if(e.key==='Escape')closeRecord();if(e.key==='Tab'){const a=[...$('#recordDialog').querySelectorAll('button,input,select,textarea')],first=a[0],last=a.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
$('#photo').onchange=e=>{photo=null;$('#preview').innerHTML='';$('#recordError').textContent='';const f=e.target.files[0];if(!f)return;if(f.size>2*1024*1024||!['image/png','image/jpeg','image/webp'].includes(f.type)){$('#recordError').textContent='2MB 이하 JPG·PNG·WEBP 사진을 골라 주세요.';e.target.value='';return;}const reader=new FileReader();reader.onload=()=>{photo=reader.result;const img=document.createElement('img');img.className='preview';img.alt='작업 사진 미리보기';img.src=photo;$('#preview').replaceChildren(img);};reader.readAsDataURL(f);};
$('#recordForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),next=[...records,{id:globalThis.crypto?.randomUUID?.()||String(Date.now()),category:f.get('category'),date:f.get('date'),amount:+f.get('amount'),memo:f.get('memo'),photo}];try{localStorage.setItem('ev-zero-records',JSON.stringify(next));}catch{$('#recordError').textContent='브라우저 저장 공간이 부족해요. 사진을 줄이거나 빼고 다시 저장해 주세요.';return;}records=next;render();closeRecord();e.target.reset();e.target.elements.date.value='2026-10-06';photo=null;$('#preview').innerHTML='';toast('기록을 저장했어요. 월간 요약에도 반영했어요.');};
function exportRecords(){const url=URL.createObjectURL(new Blob([JSON.stringify({schema_version:1,mode:'prototype-local',records},null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='ev-zero-records.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}new ResizeObserver(()=>{if($('#trend'))drawTrend();}).observe($('#content'));select(0);
})();</script></body></html>
