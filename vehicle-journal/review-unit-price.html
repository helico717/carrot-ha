<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>차계부 상세 기록 단가 표시 검토</title>
<!--
  검토용 하네스: 실제 carrot-vehicle-journal.js 를 그대로 불러와 "상세 기록" 표를 그린다.
  저장소 루트에서  python3 -m http.server 8765  실행 후
  http://localhost:8765/vehicle-journal/review-unit-price.html   (열면 "상세 기록" 탭이 자동으로 열린다)
  기록·금액·수량은 모두 합성 데이터다(운영 데이터 아님). 서버가 계산해 주는 unit_price 값(원/정수)을 합성으로 넣었다.
  단가 표시는 이제 프로덕션 코드에 반영된 동작을 그대로 보여준다(덧입히기 코드 없음): 금액 아래 작은 비볼드 "313원/kWh"·"1,701원/L", 추정 수량이면 "약 200원/kWh".
-->
<style>
  :root{--j-bg:#0b1014;--j-surface:#161e25;--j-raised:#202c36;--j-border:#2a3945;--j-ink:#f1f6fa;--j-sub:#a8bdca;--j-accent:#81e6c5}
  body{margin:0;background:var(--j-bg);color:var(--j-ink);font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif}
  .bar{position:sticky;top:0;z-index:5000;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:#0f161c;border-bottom:1px solid var(--j-border);font-size:13px}
  .bar b{color:var(--j-accent)} .bar small{color:var(--j-sub)}
  .bar button{background:var(--j-raised);color:var(--j-ink);border:1px solid var(--j-border);border-radius:10px;padding:7px 11px;font-size:12.5px;cursor:pointer}
  .bar button[aria-pressed=true]{border-color:var(--j-accent);color:var(--j-accent)}
</style>
</head>
<body>
<div class="bar"><b>단가 표시 검토</b>
<small>충전(청구 kWh) · 충전(배터리 추정, "약") · 주유(L) 예시와, 단가가 없는 세차·정비 행이 섞여 있어요. 전기차/내연기관을 한 화면에 보이려고 섞은 합성 데이터예요.</small></div>
<main id="mount"></main>
<script type="module">
const rec=(id,date,cat,krw,extra={})=>({id,kind:'expense',origin:'automatic',status:'active',version:1,accounting_date:date,category:cat,actual_krw:krw,estimated_krw:null,attachments:[],location:null,...extra});
const L=(name)=>({name,address:name});
const records=[
  rec('r1','2026-10-25','charging',8728,{location:L('꽃지해안공원 주차장 전기차충전소'),unit_price:{krw:200,unit:'kWh',approximate:true}}),
  rec('r2','2026-10-21','charging',10974,{location:L('티스테이션 의왕시청점 전기차충전소'),unit_price:{krw:313,unit:'kWh',approximate:false}}),
  rec('r3','2026-10-20','refueling',82000,{origin:'manual',location:L('구리제일주유소'),unit_price:{krw:1701,unit:'L',approximate:false}}),
  rec('r4','2026-10-20','charging',1234567,{origin:'manual',location:L('테슬라 슈퍼차저 판교'),unit_price:{krw:1234,unit:'kWh',approximate:false}}),
  rec('r5','2026-10-19','washing',9000,{origin:'manual',memo:'세차'}),
  rec('r6','2026-10-12','maintenance',450000,{origin:'manual',subcategory:'휠 타이어 구매',memo:'235 60 R18'}),
];
const hass={callWS:async msg=>{
  const t=msg.type;
  if(t.endsWith('/entries'))return [{entry_id:'demo',title:'검토용 차량',linked:true,fuel:'electric'}];
  if(t.endsWith('/query'))return {totals:{},daily:[],records,recent_records:records,record_count:records.length,timezone:'Asia/Seoul',has_more:false,status:{phase:'complete'},latest:{},station_stats:{places:[],unlocated_records:0,basis:''},expense_category_groups_supported:true,manual_trip_records_supported:true};
  if(t.endsWith('/map/config'))return {key:'',rest_configured:false};
  return {};
}};
await import('../custom_components/carrot_ha/frontend/carrot-vehicle-journal.js');
const card=document.createElement('carrot-vehicle-journal');
document.getElementById('mount').append(card);card.setConfig({});card.hass=hass;window.card=card;
setTimeout(()=>card.selectTab(3),700);
</script>
</body>
</html>
