<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오픈파일럿 통계 변경 프리뷰</title>
<link rel="stylesheet" href="./frontend/carrot-assets/leaflet.css">
<style>body{margin:0;font:14px system-ui;background:#f4f6f8;color:#18252b}header{position:sticky;top:0;z-index:100;background:#fff;padding:14px 20px;display:flex;gap:16px;flex-wrap:wrap;border-bottom:1px solid #ddd;align-items:center}button,select{font:inherit;padding:6px 10px;border:1px solid #bbb;border-radius:8px;background:#fff;color:#18252b}main{padding:20px;max-width:1450px;margin:auto}header span{font-size:12px;color:#52636b}</style>
<header><strong>통계 프리뷰</strong><label>언어 <select id="lang"><option value="ko">한국어</option><option value="en">English</option></select></label><label>테마 <select id="theme"><option value="light">라이트</option><option value="dark">다크</option></select></label><label>선택 날짜 <select id="date"></select></label><label>당일 기록 <select id="mode"><option value="has">있음</option><option value="none">없음</option><option value="zero">수동 주행만 (0%)</option></select></label><button id="open">다시 열기</button><span>실제 전체 카드 모듈 · 합성 데이터 · 게이지 두께 2배 · 숫자 소폭 축소 · SVG 체크</span></header><main id="mount"></main>
<script type="module">
import Korean from './frontend/carrot-dashboard-ko.js';import English from './frontend/carrot-dashboard-en.js';
import {assistState,dayKey} from './frontend/carrot-assist-stats.js';
customElements.define('assist-preview-ko',class extends Korean {connectedCallback(){this.setupTabsObserver();}});customElements.define('assist-preview-en',class extends English {connectedCallback(){this.setupTabsObserver();}});
const today=dayKey(0,'Asia/Seoul');const previous=dayKey(-1,'Asia/Seoul');
date.innerHTML=`<option>${today}</option><option>${previous}</option>`;
const summary=()=>({measured:true,since:previous+'T00:00:00Z',trips:8,total:{assist_m:120000,manual_m:60000,ratio:2/3},days:[{date:previous,active:true,assist_m:90000,manual_m:10000,ratio:.9},...(mode.value==='none'?[]:[{date:today,active:mode.value!=='zero',assist_m:mode.value==='zero'?0:30000,manual_m:mode.value==='zero'?50000:50000,ratio:mode.value==='zero'?0:.375}])],months:[{month:today.slice(0,7),assist_m:120000,manual_m:60000,ratio:2/3}],current_streak_days:2,best_streak_days:4,disengagements:14,longest_streak:{distance_m:23840,start_at:previous+'T02:00:00Z',end_at:previous+'T02:30:00Z'}});
const trips=[today,previous].map((d,i)=>({event_id:'mock-'+i,data:{started_at:d+'T01:00:00Z',ended_at:d+'T02:00:00Z',duration_s:3600,distance_m:80000,route:[{latitude:37.5,longitude:127,speed_mps:12},{latitude:37.51,longitude:127.01,speed_mps:15}],energy_used_wh:12000}}));
window.mockHass={states:{},themes:{darkMode:false},config:{time_zone:'Asia/Seoul'},locale:{language:'ko'},callApi:async(m,p)=>p.endsWith('/devices')?{devices:[{entry_id:'preview',device_id:'preview'}]}:p.includes('/dashboard/')?{values:{soc_percent:72,parking_latitude:37.5,parking_longitude:127,charging:false,onroad:false,battery_history:[]}}:{events:p.includes('kind=trip')?trips:[]},callWS:async m=>m.period==='all'?summary():{measured:true,longest_streak:{distance_m:14400,start_at:m.date+'T01:00:00Z',end_at:m.date+'T01:20:00Z'},disengagements:3}};
function open(){window.card?.remove();const c=window.card=document.createElement('assist-preview-'+lang.value);c.setConfig({device_id:'preview',vehicle_name:'ID.4 Preview',color_mode:theme.value});c._hass=mockHass;c.device={entry_id:'preview',device_id:'preview'};c.tab='trips';c.tripDay=date.value;c.trips=trips;c.v={soc_percent:72};c.initialized=true;c._initialDataSettled=true;const a=assistState(c);a.all=summary();a.at=Date.now();for(const d of [today,previous])a.days[d]={at:Date.now(),measured:true,longest_streak:{distance_m:14400,start_at:d+'T01:00:00Z',end_at:d+'T01:20:00Z'},disengagements:3};mount.replaceChildren(c);c.render();}
open();for(const el of [lang,theme,date,mode])el.onchange=open;document.querySelector('#open').onclick=open;
</script></html>
