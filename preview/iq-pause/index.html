<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IQ.drive 일시중지 프리뷰</title>
<style>
  :root { color-scheme: dark; --primary-text-color:#e1e1e1; --secondary-text-color:#9aa0a6; --card-background-color:#1c1c1c;
    --ha-card-background:#1c1c1c; --divider-color:rgba(255,255,255,.12); --primary-color:#03a9f4; --error-color:#ff5252;
    --ha-card-border-radius:12px; --page-bg:#111; }
  :root[data-theme="light"] { color-scheme: light; --primary-text-color:#212121; --secondary-text-color:#5f6368;
    --card-background-color:#fff; --ha-card-background:#fff; --divider-color:rgba(0,0,0,.12); --page-bg:#f0f0f0; }
  body { margin:0; background:var(--page-bg); color:var(--primary-text-color); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .bar { position:sticky; top:0; z-index:100; display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 16px;
    background:#263238; color:#fff; font-size:13px; }
  .bar button { border:0; border-radius:999px; padding:7px 14px; cursor:pointer; background:#455a64; color:#fff; font-size:13px; }
  .bar button[aria-pressed="true"] { background:#ff7a29; }
  .bar .state { margin-left:auto; opacity:.85; }
  main { display:grid; gap:16px; padding:16px; max-width:1200px; margin:0 auto; }
  h2 { margin:8px 0 0; font-size:14px; color:var(--secondary-text-color); font-weight:600; }
  ha-card { display:block; background:var(--ha-card-background); border-radius:var(--ha-card-border-radius); }
</style>
</head>
<body>
<div class="bar">
  <strong>Comma 소프트웨어</strong>
  <button id="carrot" aria-pressed="true">당근파일럿</button>
  <button id="iq" aria-pressed="false">IQ.drive (iq-ha)</button>
  <strong style="margin-left:12px">테마</strong>
  <button id="dark" aria-pressed="true">다크</button>
  <button id="light" aria-pressed="false">라이트</button>
  <span class="state" id="state"></span>
</div>
<main>
  <h2>당근파일럿 파라미터 설정 카드 (carrot-params-card)</h2>
  <carrot-params-card id="params"></carrot-params-card>
  <h2>당근웹 로그 카드 (carrot-logs-card)</h2>
  <carrot-logs-card id="logs"></carrot-logs-card>
</main>
<script>
  // Minimal HA shims for preview: ha-card and ha-icon render as plain blocks.
  if (!customElements.get('ha-card')) customElements.define('ha-card', class extends HTMLElement {});
  if (!customElements.get('ha-icon')) customElements.define('ha-icon', class extends HTMLElement {
    connectedCallback() { this.textContent = this.getAttribute('icon') === 'mdi:pause-circle-outline' ? '⏸' : '⚙'; this.style.fontSize = '32px'; }
  });
</script>
<script type="module">
  const state = {pilot: 'carrot', requests: []};
  const catalog = await (await fetch('/preview/iq-pause/carrot_settings.json')).json();
  const values = Object.fromEntries((catalog.params || []).map(item => [item.name, item.default ?? 0]));
  const label = document.getElementById('state');
  const record = (method, path, status) => {
    state.requests.unshift(`${method} ${path.split('?')[0]} → ${status}`);
    state.requests.length = Math.min(state.requests.length, 3);
    label.textContent = state.requests.join('  |  ');
  };
  // Mirrors the HA API contract added in this change: devices reports pilot_software and
  // param_set / driving log session refuse with 409 while the Comma runs iq-ha.
  const hass = {
    locale: {language: 'ko'},
    async callApi(method, path, body) {
      const iq = state.pilot === 'iqpilot';
      if (path === 'carrot_ha/v1/devices') {
        record(method, path, 200);
        return {devices: [{entry_id: 'entry1', device_id: 'comma-preview', name: 'ID.4 (프리뷰)', cloud_status: 'ok', pilot_software: state.pilot}]};
      }
      if (path.startsWith('carrot_ha/v1/settings/')) {
        record(method, path, 200);
        return {ok: true, catalog, values, device_id: 'comma-preview', updated_at: '2026-11-02T05:00:00Z'};
      }
      if (path.startsWith('carrot_ha/v1/param_status/')) { record(method, path, 200); return {ok: true, statuses: {}}; }
      if (path.startsWith('carrot_ha/v1/param_set/')) {
        if (iq) { record(method, path, 409); throw Object.assign(new Error('paused_iqpilot'), {status: 409}); }
        record(method, path, 200); return {ok: true, queued: true, id: 'preview'};
      }
      if (path.endsWith('/session')) {
        if (iq) { record(method, path, 409); throw Object.assign(new Error('paused_iqpilot'), {status: 409}); }
        record(method, path, 200); return {base: '/api/carrot_ha/v1/driving_logs/entry1', enabled: true, expires_in: 3600};
      }
      record(method, path, 404);
      throw new Error('preview: ' + path);
    },
  };
  await import('/custom_components/carrot_ha/frontend/carrot-params-card.js');
  await import('/custom_components/carrot_ha/frontend/carrot-logs-card.js');
  const params = document.getElementById('params');
  const logs = document.getElementById('logs');
  params.setConfig({device_id: ''}); params.hass = hass;
  logs.setConfig({device_id: ''}); logs.hass = hass;

  const press = (on, off) => { document.getElementById(on).setAttribute('aria-pressed', 'true'); document.getElementById(off).setAttribute('aria-pressed', 'false'); };
  // The cards recheck every 30 s on their own; the preview skips that wait.
  const recheck = () => { params._deviceCheckedAt = 0; params._loadData(); logs._pilotCheckedAt = 0; logs._connect(); };
  document.getElementById('carrot').onclick = () => { state.pilot = 'carrot'; press('carrot', 'iq'); recheck(); };
  document.getElementById('iq').onclick = () => { state.pilot = 'iqpilot'; press('iq', 'carrot'); recheck(); };
  document.getElementById('dark').onclick = () => { document.documentElement.dataset.theme = 'dark'; press('dark', 'light'); };
  document.getElementById('light').onclick = () => { document.documentElement.dataset.theme = 'light'; press('light', 'dark'); };
  window.previewState = state;
</script>
</body>
</html>
