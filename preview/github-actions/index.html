<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>원격 터미널 · GitHub 동기화 프리뷰</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#0e1015;color:#eceef4;font:14px -apple-system,BlinkMacSystemFont,sans-serif;--card-background-color:#191d26;--primary-text-color:#eceef4;--secondary-text-color:#9ba4b8;--divider-color:#303644;--primary-color:#70a9fa;--secondary-background-color:#141821}body.light{background:#f0f2f6;color:#17202e;--card-background-color:#fff;--primary-text-color:#17202e;--secondary-text-color:#657187;--divider-color:#e0e5ed;--primary-color:#1260e8;--secondary-background-color:#f5f7fa}.bar{max-width:920px;margin:0 auto 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}.bar h1{font-size:16px;margin:0 auto 0 0}.bar label{font-size:12px;display:flex;gap:6px;align-items:center}select,button{border:1px solid var(--divider-color);border-radius:8px;background:var(--card-background-color);color:inherit;padding:8px}.hint{max-width:920px;margin:0 auto 18px;color:var(--secondary-text-color);font-size:12px;line-height:1.7}.frame{max-width:920px;margin:auto}.frame.mobile{max-width:390px}ha-card{display:block}carrot-terminal-card{display:block} @media(max-width:600px){body{padding:12px}.bar h1{width:100%}}
</style>
<div class="bar"><h1>원격 터미널 · 동기화 상태 프리뷰</h1><label>상태<select id="scenario"><option value="healthy">예약 정상</option><option value="overdue">예약 12시간 초과</option><option value="failed">실행 실패</option><option value="pending">원본 변경 대기</option><option value="unavailable">GitHub 조회 실패</option><option value="running">실행 중</option><option value="no_schedule">예약 기록 없음</option><option value="disabled">워크플로 비활성</option></select></label><label>테마<select id="theme"><option value="dark">다크</option><option value="light">라이트</option></select></label><label>화면<select id="width"><option value="desktop">데스크톱</option><option value="mobile">모바일</option></select></label><label>Comma<select id="connection"><option value="online">주차·연결 가능</option><option value="offline">오프라인</option><option value="driving">주행 중</option></select></label></div>
<p class="hint">실제 운영 터미널 카드 전체와 xterm을 사용합니다. 아래 명령·Git Pull·재부팅은 합성 mockHass로만 응답하며 기기에 전송되지 않습니다. 새 동기화 영역은 기기 오프라인 상태에서도 확인할 수 있습니다.</p>
<div id="frame" class="frame"><carrot-terminal-card id="card"></carrot-terminal-card></div>
<script src="/carrot_ha_static/carrot_web/js/vendor/xterm.js"></script><script src="/carrot_ha_static/carrot_web/js/vendor/xterm-addon-fit.js"></script><script src="/carrot_ha_static/carrot-terminal-card.js"></script>
<script>
const card=document.querySelector('#card');let eventSink;let active=false;
const now=()=>Date.now();const iso=age=>new Date(now()-age*3600000).toISOString();
function observation(){const state=document.querySelector('#scenario').value;const run=(id,event,age,conclusion='success',status='completed')=>({id,event,created_at:iso(age),conclusion,status});const data={state,latest_run:run(44213400177,'schedule',2),scheduled_run:run(44213400177,'schedule',2),comparison:{upstream_pending:0},last_attempt_at:iso(.5),last_success_at:iso(.5)};
if(state==='overdue'){data.latest_run=run(44213400177,'workflow_dispatch',1);data.scheduled_run=run(42128792825,'schedule',15)}
if(state==='failed')data.latest_run=run(44213400177,'schedule',1,'failure');
if(state==='pending')data.comparison.upstream_pending=14;
if(state==='unavailable'){data.last_success_at=iso(7);data.comparison.upstream_pending=4;data.errors={comparison:'unavailable'}}
if(state==='no_schedule')data.scheduled_run=null;
if(state==='running')data.latest_run=run(44213400177,'schedule',.05,null,'in_progress');
return {installed_commit:'fdd8294b840ab6ba4d2423c5bbbe22f9128a1ccc',latest_commit:'176b980f0000000000000000000000000000000000',latest_message:'chore: auto-sync upstream happymaj11r/carrot-wip-model_selector',behind:1,ahead:0,comparison:'ahead',branch:'carrot-wip-model_selector-ha',installed_measured_at:iso(.2),checked_at:iso(.05),actions_sync:data}}
function status(){const c=document.querySelector('#connection').value;eventSink?.({type:'status',connected:c!=='offline',ready:c==='online',controller:false,active:active&&c==='online'});if(c!=='online')active=false}
const text=t=>eventSink?.({type:'terminal',message:{type:'pty_output',b64:btoa(unescape(encodeURIComponent(t)))}});
const mockHass={config:{time_zone:'Asia/Seoul'},callWS:async()=>observation(),connection:{subscribeMessage:async cb=>{eventSink=cb;queueMicrotask(status);return()=>{eventSink=null}},sendMessagePromise:async m=>{if(m.type.endsWith('/acquire')){active=true;setTimeout(()=>text('\x1b[32m[PREVIEW]\x1b[0m Mock terminal connected. No device commands are sent.\r\ncomma@preview:~$ '),80);return {}}if(m.type.endsWith('/release')){active=false;return {}}if(m.type.endsWith('/input')){let input=m.message?.data||'';if(input.includes('git '))text(input+'\r\n[PREVIEW] git command simulated.\r\ncomma@preview:~$ ');else if(input.includes('reboot'))text('\r\n[PREVIEW] reboot simulated.\r\n');else text(input.replace(/\r/g,'\r\ncomma@preview:~$ '));return {}}return {}}}};
card.setConfig({device_id:'preview-id4',height:'480px'});card.hass=mockHass;
for(const id of ['scenario','theme','width','connection'])document.querySelector('#'+id).onchange=()=>{document.body.classList.toggle('light',document.querySelector('#theme').value==='light');document.querySelector('#frame').classList.toggle('mobile',document.querySelector('#width').value==='mobile');status();card._refreshGitStatus();setTimeout(()=>card._fit(),50)};
window.previewReady=true;
</script></html>
