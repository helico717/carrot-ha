<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>운영 코드 검증 하네스</title>
<link rel="stylesheet" href="../../custom_components/carrot_ha/frontend/carrot-assets/leaflet.css">
<style>body{margin:0;font-family:system-ui}.bar{position:sticky;top:0;z-index:100;display:flex;gap:10px;flex-wrap:wrap;padding:8px 14px;background:#16181b;color:#e8eaed;font-size:12px}.bar label{display:inline-flex;gap:4px}#stage{padding:20px 14px 60px;min-height:100vh;background:var(--stage)}#host,#jhost{max-width:1100px;margin:auto}#jhost{display:none}</style></head>
<body><div class="bar"><b>운영 코드 하네스(프리뷰 주입 없음)</b>
<label><input type="radio" name="view" value="dash" checked>대시보드</label><label><input type="radio" name="view" value="journal">차계부</label>
<label><input type="radio" name="ha" value="default" checked>HA 기본</label><label><input type="radio" name="ha" value="vision">visionOS</label><label><input type="radio" name="ha" value="blue">파랑</label>
<label><input type="radio" name="hamode" value="dark" checked>HA 다크</label><label><input type="radio" name="hamode" value="light">HA 라이트</label></div>
<div id="stage"><div id="host"></div><div id="jhost"></div></div>
<script type="module">
class HaIcon extends HTMLElement{connectedCallback(){this.innerHTML='<svg viewBox="0 0 24 24" style="width:var(--mdc-icon-size,20px);height:var(--mdc-icon-size,20px);display:block;margin:auto;fill:currentColor"><circle cx="12" cy="12" r="6"/></svg>';}}
if(!customElements.get('ha-icon'))customElements.define('ha-icon',HaIcon);
const {callApi,jhass,TZ}=await import('./mock-data.js');
const F='../../custom_components/carrot_ha/frontend/';
const {default:Card}=await import(F+'carrot-dashboard-ko.js');customElements.define('carrot-dashboard-ko',Card);
const {default:CardEn}=await import(F+'carrot-dashboard-en.js');customElements.define('carrot-dashboard-en',CardEn);
await import(F+'carrot-vehicle-journal.js');
const card=document.createElement('carrot-dashboard-ko');document.getElementById('host').append(card);card.setConfig({language:'ko',device_id:'fixture'});
const j=document.createElement('carrot-vehicle-journal');document.getElementById('jhost').append(j);j.setConfig({});
const HA={default:{dark:{'--primary-color':'#03a9f4','--primary-text-color':'#e1e1e1','--secondary-text-color':'#9b9b9b','--card-background-color':'#1c1c1c','--divider-color':'rgba(225,225,225,.12)','--primary-background-color':'#111111','--stage':'#111'},light:{'--primary-color':'#03a9f4','--primary-text-color':'#212121','--secondary-text-color':'#727272','--card-background-color':'#ffffff','--divider-color':'rgba(0,0,0,.12)','--primary-background-color':'#fafafa','--stage':'#fafafa'}},
vision:{dark:{'--primary-color':'#ff9f43','--primary-text-color':'#f5f2ee','--secondary-text-color':'rgba(245,242,238,.62)','--ha-card-background':'rgba(255,255,255,.10)','--card-background-color':'#3a3632','--ha-dialog-surface-background':'rgba(52,48,44,.78)','--divider-color':'rgba(255,255,255,.14)','--ha-card-backdrop-filter':'blur(24px) saturate(1.4)','--primary-background-color':'#4a423b','--stage':'linear-gradient(135deg,#5b5651,#3f3b37 55%,#4a423b)'},light:{'--primary-color':'#ff7a00','--primary-text-color':'#2b2723','--secondary-text-color':'rgba(43,39,35,.62)','--ha-card-background':'rgba(255,255,255,.55)','--card-background-color':'#f5eee6','--ha-dialog-surface-background':'rgba(255,252,247,.78)','--divider-color':'rgba(0,0,0,.10)','--ha-card-backdrop-filter':'blur(24px) saturate(1.4)','--primary-background-color':'#e4d2bd','--stage':'linear-gradient(135deg,#f3e6d6,#e4d2bd 55%,#f0dcc6)'}},
blue:{dark:{'--primary-color':'#4c8dff','--primary-text-color':'#e8eefc','--secondary-text-color':'#9db0d6','--card-background-color':'#141b2b','--divider-color':'rgba(157,176,214,.18)','--primary-background-color':'#0b1020','--stage':'#0b1020'},light:{'--primary-color':'#1f6feb','--primary-text-color':'#14213d','--secondary-text-color':'#5b6b8c','--card-background-color':'#ffffff','--divider-color':'rgba(20,33,61,.12)','--primary-background-color':'#eef3fb','--stage':'#eef3fb'}}};
const st={theme:'default',dark:true};
function apply(){const r=document.documentElement;for(const t of Object.values(HA))for(const m of Object.values(t))for(const k of Object.keys(m))if(k!=='--stage')r.style.removeProperty(k);
 const v=HA[st.theme][st.dark?'dark':'light'];for(const [k,x] of Object.entries(v)){if(k==='--stage')document.getElementById('stage').style.setProperty('--stage',x);else r.style.setProperty(k,x);}
 r.style.colorScheme=st.dark?'dark':'light';
 card.hass={locale:{language:'ko'},themes:{darkMode:st.dark,theme:st.theme},states:{},config:{time_zone:TZ},callApi};j.hass=jhass(st.dark);}
document.querySelectorAll('input[name=ha]').forEach(x=>x.onchange=()=>{st.theme=x.value;apply();});
document.querySelectorAll('input[name=hamode]').forEach(x=>x.onchange=()=>{st.dark=x.value==='dark';apply();});
document.querySelectorAll('input[name=view]').forEach(x=>x.onchange=()=>{document.getElementById('host').style.display=x.value==='dash'?'':'none';document.getElementById('jhost').style.display=x.value==='journal'?'block':'none';});
apply();window.__h={card,j,st,apply};
</script></body></html>
