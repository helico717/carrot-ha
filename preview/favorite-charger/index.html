<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자주 가는 충전소 · 상세 기록 표시 검토</title>
<!--
  검토용 하네스. 이 폴더의 carrot-vehicle-journal.js / carrot-journal-design.js 는 운영 파일의 사본에
  apply_ui.py 를 적용한 것이다(운영 파일은 승인 전까지 수정하지 않는다). 나머지 모듈은 운영 파일을 그대로 불러온다.
  저장소 루트에서  python3 -m http.server 8770  실행 후
  http://localhost:8770/preview/favorite-charger/index.html
  차량·기록·주소·좌표는 모두 합성 데이터이고, 카카오 지도/검색과 서버 응답도 합성이다.
-->
<style>
  :root{--j-bg:#0b1014;--j-surface:#161e25;--j-raised:#202c36;--j-border:#2a3945;--j-ink:#f1f6fa;--j-sub:#a8bdca;--j-accent:#81e6c5}
  html,body{height:100%}
  body{margin:0;display:flex;flex-direction:column;overflow:hidden;background:var(--j-bg);color:var(--j-ink);font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif}
  .scroller{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
  .bar{flex-shrink:0;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:10px 14px;background:#0f161c;border-bottom:1px solid var(--j-border);font-size:13px}
  .bar b{color:var(--j-accent)} .bar small{color:var(--j-sub);flex:1 1 260px;line-height:1.45}
  .bar button{background:var(--j-raised);color:var(--j-ink);border:1px solid var(--j-border);border-radius:9999px;padding:6px 12px;font-size:12.5px;cursor:pointer}
  .bar button:hover{border-color:var(--j-accent)}
  #log{flex-basis:100%;color:var(--j-sub);font-size:12px;min-height:16px}
</style>
</head>
<body>
<div class="bar">
  <b>자주 가는 충전소</b>
  <small>① 주소만 기록된 충전 행의 [수정] → 위치에서 충전소 선택 → ★ 등록 → 저장. ② [새 자동 충전 발생]을 누르면 등록 여부에 따라 이름이 달라져요.</small>
  <button id="simulate" type="button">새 자동 충전 발생(집)</button>
  <button id="simulateOther" type="button">새 자동 충전 발생(다른 곳)</button>
  <button id="reset" type="button">처음 상태로</button>
  <div id="log"></div>
</div>
<div class="scroller"><main id="mount"></main></div>
<script>
if(location.protocol==='file:')document.getElementById('mount').innerHTML='<p style="margin:24px 14px;line-height:1.6">파일로 직접 열면 모듈을 불러오지 못해요. 저장소 루트에서 <code>python3 -m http.server 8770</code> 실행 후 http://localhost:8770/preview/favorite-charger/index.html 로 열어 주세요.</p>';
</script>
<script type="module">
/* ---------- 합성 카카오 지도 ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
class LatLng{constructor(a,b){this.a=a;this.b=b}getLat(){return this.a}getLng(){return this.b}}
class FakeMap{
  constructor(el,o){this.el=el;this.listeners=[];this.center=o?.center||new LatLng(37.5665,126.978);
    el.replaceChildren();const root=document.createElement('div');root.style.cssText='position:relative;width:100%;height:100%;min-height:160px;cursor:crosshair;overflow:hidden;background-color:#dfe7e2;background-image:linear-gradient(rgba(0,0,0,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.08) 1px,transparent 1px);background-size:36px 36px';root.innerHTML='<span style="position:absolute;left:8px;top:8px;font-size:11px;color:#33433b;background:rgba(255,255,255,.8);padding:2px 6px;border-radius:6px">합성 지도</span>';el.append(root);this.root=root;
    root.addEventListener('click',e=>{const r=root.getBoundingClientRect();const lat=this.center.getLat()+(0.5-(e.clientY-r.top)/r.height)*0.01;const lng=this.center.getLng()+((e.clientX-r.left)/r.width-0.5)*0.016;this.listeners.forEach(f=>f({latLng:new LatLng(lat,lng)}));});}
  setCenter(p){this.center=p;this.marker?.draw()} getCenter(){return this.center} relayout(){}
}
class Marker{
  constructor(o){this.pos=o.position;this.map=null}
  setPosition(p){this.pos=p;this.draw()}
  setMap(m){this.map=m;if(m)m.marker=this;this.draw()}
  draw(){if(!this.map)return;const root=this.map.root;let pin=root.querySelector('.pin');if(!pin){pin=document.createElement('div');pin.className='pin';pin.style.cssText='position:absolute;width:22px;height:22px;margin:-22px 0 0 -11px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#e5484d;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)';root.append(pin)}
    const c=this.map.center;pin.style.left=clamp(50+(this.pos.getLng()-c.getLng())/0.016*100,3,97)+'%';pin.style.top=clamp(50-(this.pos.getLat()-c.getLat())/0.01*100,8,98)+'%';}
}
window.__journalKakaoKey='demo';window.__journalKakao=Promise.resolve({Map:FakeMap,LatLng,Marker,event:{addListener:(m,ev,fn)=>{if(ev==='click')m.listeners.push(fn)}}});

/* ---------- 합성 데이터 ---------- */
const HOME='경기 가람시 한빛로 12',OTHER='충남 솔빛군 해안로 400';
const homeAddress={name:HOME,address:HOME,latitude:37.3601,longitude:126.9702,provider:'kakao',station_type:'charging',selection_source:'automatic_address'};
const otherAddress={name:OTHER,address:OTHER,latitude:36.5015,longitude:126.3374,provider:'kakao',station_type:'charging',selection_source:'automatic_address'};
const chargerA={name:'한빛마을2단지A 전기차충전소',address:HOME,latitude:37.3603,longitude:126.9700,provider:'kakao',station_id:'901',station_type:'charging'};
const chargerB={name:'한빛마을2단지B 전기차충전소',address:HOME,latitude:37.3600,longitude:126.9705,provider:'kakao',station_id:'902',station_type:'charging'};
const mart={name:'가람마트 전기차충전소',address:'경기 가람시 시청로 11',latitude:37.3447,longitude:126.9683,provider:'kakao',station_id:'1',station_type:'charging',selection_source:'automatic'};
let n=0,records,favorites,odometer;
const charge=(date,krw,kwh,location,extra={})=>{odometer+=Math.round(40+kwh*4);return {id:'00000000-0000-4000-8000-'+String(++n).padStart(12,'0'),kind:'expense',origin:'automatic',status:'active',version:1,accounting_date:date,started_at:`${date}T21:10:00+09:00`,category:'charging',actual_krw:krw,estimated_krw:null,location:location&&{...location},attachments:[],odometer_km:odometer,billed_charge_kwh:null,battery_charge_kwh:kwh,automatic_charge:{odometer_km:odometer,battery_charge_kwh:kwh,billed_charge_kwh:null,session_count:1},unit_price:{krw:Math.round(krw/kwh),unit:'kWh',approximate:true},...extra};};
const seed=()=>{n=0;odometer=84210;favorites=[];records=[
  charge('2026-10-18',6240,18.07213,homeAddress),
  charge('2026-10-21',10974,31.80641,mart),
  charge('2026-10-24',9100,26.41877,homeAddress),
  {id:'00000000-0000-4000-8000-9000000000aa',kind:'expense',origin:'manual',status:'active',version:1,accounting_date:'2026-10-26',category:'washing',subcategory:'손세차',actual_krw:25000,estimated_krw:null,location:{name:'가람 디테일링',address:'경기 가람시 중앙로 5'},attachments:[],odometer_km:84780,input:{odometer_km:84780}},
  charge('2026-10-29',8728,21.5,otherAddress),
  charge('2026-11-02',4200,12.20388,null),
  {...charge('2026-11-05',7350,21.37,mart),origin:'manual',input:{billed_charge_kwh:21.37,odometer_km:85024},battery_charge_kwh:null,automatic_charge:undefined,unit_price:{krw:344,unit:'kWh',approximate:false}},
  charge('2026-11-08',13472,39.04999,homeAddress),
].reverse();};
seed();
const log=text=>{document.getElementById('log').textContent=text;};
const sameAddress=(a,b)=>!!a&&!!b&&a.address===b.address;
const hass={callWS:async msg=>{
  const t=msg.type;
  if(t.endsWith('/entries'))return [{entry_id:'demo',title:'검토용 전기차',linked:true,fuel:'electric'}];
  if(t.endsWith('/query')){
    let rows=records;if(msg.record_categories?.length)rows=rows.filter(r=>msg.record_categories.includes(r.category));
    return {totals:{},daily:[],records:rows,recent_records:records,record_count:rows.length,timezone:'Asia/Seoul',has_more:false,status:{phase:'complete'},latest:{},station_stats:{places:[],unlocated_records:0,basis:''},expense_category_groups_supported:true,manual_trip_records_supported:true};
  }
  if(t.endsWith('/map/config'))return {key:'demo',rest_configured:true};
  if(t.endsWith('/location/search')){await new Promise(r=>setTimeout(r,200));const q=(msg.query||'').trim();
    if(q.includes('한빛')||q.includes('가람시 한빛로'))return [{...chargerA,selection_source:'manual'},{...chargerB,selection_source:'manual'}];
    if(q.includes('가람마트'))return [{...mart,selection_source:'manual'}];
    return [];}
  if(t.endsWith('/favorite/list'))return favorites.map(f=>({...f}));
  if(t.endsWith('/favorite/save')){
    const place={...msg.location};delete place.selection_source;place.station_type='charging';
    let favorite=favorites.find(f=>f.location.station_id?f.location.station_id===place.station_id:f.location.name===place.name&&f.location.address===place.address);
    if(favorite)favorite.location=place;else{favorite={id:'fav'+Date.now(),location:place,anchors:[],created_at:new Date().toISOString()};favorites.push(favorite);}
    let applied=0;
    if(msg.apply_past)for(const r of records)if(r.origin==='automatic'&&r.category==='charging'&&r.location?.selection_source==='automatic_address'&&sameAddress(r.location,place)){r.location={...place,selection_source:'favorite'};r.version++;applied++;}
    log(`즐겨찾기 등록: ${place.name}${msg.apply_past?` · 이전 기록 ${applied}건에 적용`:''}`);
    return {id:favorite.id,anchors:1,applied};
  }
  if(t.endsWith('/favorite/delete')){favorites=favorites.filter(f=>f.id!==msg.favorite_id);log('즐겨찾기에서 뺐어요. 이미 기록된 이름은 그대로예요.');return {id:msg.favorite_id};}
  if(t.endsWith('/record/save')){
    let r=records.find(x=>x.id===msg.record_id);const p=msg.payload;
    if(!r){r={id:msg.record_id,kind:p.kind,origin:'manual',status:'active',version:0,accounting_date:p.date,attachments:[],estimated_krw:null};records.unshift(r);}
    Object.assign(r,{version:r.version+1,input:p,accounting_date:p.date,category:p.category,subcategory:p.subcategory,memo:p.memo,location:p.location||null});
    if(p.actual_krw!=null)r.actual_krw=p.actual_krw;if('odometer_km' in p)r.odometer_km=p.odometer_km;
    return {id:r.id,version:r.version};
  }
  return {};
}};
await import('./carrot-vehicle-journal.js');
const card=document.createElement('carrot-vehicle-journal');
document.getElementById('mount').append(card);card.setConfig({});card.hass=hass;window.card=card;window.preview={get records(){return records},get favorites(){return favorites}};
const refresh=async()=>{card.offset=0;await card.load(true);card.selectTab(3);};
const simulate=(address,label)=>{
  const today=new Date(Date.now()+9*3600000).toISOString().slice(0,10),kwh=Number((14+Math.random()*26).toFixed(5));
  const favorite=favorites.find(f=>sameAddress(f.location,address));
  records.unshift(charge(today,Math.round(kwh*345),kwh,favorite?{...favorite.location,selection_source:'favorite'}:address));
  log(favorite?`${label}: 즐겨찾기 '${favorite.location.name}' 이름으로 자동 기록했어요.`:`${label}: 같은 주소에 충전소가 여러 곳이라 주소만 기록했어요.`);refresh();
};
document.getElementById('simulate').onclick=()=>simulate(homeAddress,'집에서 충전');
document.getElementById('simulateOther').onclick=()=>simulate(otherAddress,'다른 곳에서 충전');
document.getElementById('reset').onclick=()=>{seed();log('처음 상태로 되돌렸어요.');refresh();};
setTimeout(()=>card.selectTab(3),600);
</script>
</body>
</html>
