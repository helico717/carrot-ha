name: Direct receiver validation
on:
  push:
    branches: [main]
    paths:
      - 'addons/carrot_receiver/**'
      - 'custom_components/carrot_ha/**'
      - 'tests/**'
      - 'tools/receiver-recovery.py'
      - '.github/workflows/receiver-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install aiohttp==3.13.3 Pillow==12.0.0 xlrd==2.0.2 voluptuous==0.15.2
      - name: Python regression suites in isolated processes
        run: |
          for suite in tests/test_*.py; do
            python -m unittest discover -s tests -p "$(basename "$suite")"
          done
          python -m unittest discover -s vehicle-journal/tests
      - name: Dashboard loading and state preservation
        run: |
          node --test tests/dashboard-live-loading.test.mjs tests/dashboard-lazy-runtime.test.mjs tests/dashboard-view-state.test.mjs tests/dashboard-battery-pagination.test.mjs
