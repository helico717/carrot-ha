<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>파라미터 실제 카드</title><style>body{margin:0;background:#101216;color:#eef2f6;font-family:system-ui}carrot-parameter-tuning-card{display:block}</style><body><script type="module">
import '/carrot_ha_static/carrot-parameter-tuning-card.js';
const item=(name,title,group,min=0,max=100,extra={})=>({name,title,group,descr:'비교용 합성 설정입니다. 실제 차량과 연결되지 않습니다.',min,max,default:min,unit:1,...extra});
const groups={
 '조향':[
 item('DemoLaneOffset','차선 중앙 보정','조향',-50,50,{descr:'차선 중앙을 기준으로 좌우 위치를 보정하는 시험 항목입니다.'}),
 item('DemoSteeringMode','조향 방식','조향',0,2,{options:{ko:['기본 조향','부드러운 차선 유지','반응이 빠른 차선 유지'],en:['Default','Smooth','Responsive']}}),
 item('DemoLaneEnable','차선 보정 사용','조향',0,1),
 ...Array.from({length:14},(_,i)=>item('DemoSteering'+i,'조향 세부 조정 '+(i+1),'조향'))],
 '속도·감속':[
 item('DemoDecel','감속 강도','속도·감속',0,100),item('DemoStopDistance','정지 거리','속도·감속',0,100),item('DemoLaneSlow','차선 변경 시 감속','속도·감속',0,1)],
 '화면·알림':[item('DemoBrightness','화면 밝기','화면·알림',0,100),item('DemoSound','알림 음량','화면·알림',0,100)]
};
window.snapshot={updated_at:new Date().toISOString(),ok:true,param_queue_protocol:1,device_id:'preview-car',values:Object.fromEntries(Object.values(groups).flat().map(p=>[p.name,p.default])),catalog:{groups:Object.entries(groups).map(([group,items])=>({group,egroup:group,count:items.length})),items_by_group:groups,unit_cycle:[1,2,5]}};
window.queue=[];window.failWrite=false;window.calls=[];
let nextId=1;
window.card=document.createElement('carrot-parameter-tuning-card');card.setConfig({device_id:'preview-car'});document.body.append(card);
card.hass={callApi:async(method,url,body)=>{
 calls.push({method,url,body});
 if(url.endsWith('/devices'))return {devices:[{device_id:'preview-car',entry_id:'preview-entry'}]};
 if(url.includes('/settings/'))return structuredClone(snapshot);
 if(url.includes('/param_status/'))return {ok:true,queue:structuredClone(queue)};
 if(url.includes('/param_set/')){
  if(failWrite)throw Error('프리뷰: 시험용 변경 실패');
  const request={id:nextId++,param_name:body.name,param_value:body.value,status:'pending'};queue.push(request);
  setTimeout(async()=>{request.status='applied';snapshot.values[body.name]=body.value;await card._checkPendingStatus();},1500);
  return {ok:true,ids:[request.id]};
 }
 throw Error('프리뷰에서 지원하지 않는 요청: '+url);
}};
</script></body></html>
