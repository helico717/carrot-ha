<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrot HA Dashboard — Live Responsive Preview</title>
  <link rel="stylesheet" href="./custom_components/carrot_ha/frontend/carrot-assets/leaflet.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #090c10;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Preview Control Bar */
    .preview-header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #f0f6fc;
      white-space: nowrap;
    }

    .brand-title .badge-tag {
      background: #238636;
      color: #fff;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }

    .controls-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .viewport-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #0d1117;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid #30363d;
    }

    .viewport-btn {
      background: transparent;
      border: 0;
      color: #8b949e;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .viewport-btn:hover {
      color: #f0f6fc;
      background: #21262d;
    }

    .viewport-btn.active {
      background: #1f6feb;
      color: #ffffff;
      box-shadow: 0 1px 4px rgba(31, 111, 235, 0.4);
    }

    /* Map 50% Toggle Button */
    .map-toggle-btn {
      background: #065f46;
      color: #6ee7b7;
      border: 1px solid #059669;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 1px 4px rgba(6, 95, 70, 0.4);
    }

    .map-toggle-btn.off {
      background: #21262d;
      color: #8b949e;
      border-color: #30363d;
      box-shadow: none;
    }

    .width-indicator {
      font-size: 12px;
      color: #8b949e;
      font-variant-numeric: tabular-nums;
      min-width: 65px;
      text-align: right;
    }

    /* Viewport Stage */
    .preview-stage {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px 40px;
      background: radial-gradient(circle at top, #161b22 0%, #090c10 100%);
      overflow-x: auto;
    }

    .frame-container {
      width: 1280px;
      max-width: 100%;
      background: #0f141c;
      border-radius: 24px;
      border: 1px solid #30363d;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .frame-inner {
      padding: 16px;
    }

    ha-card {
      display: block;
    }

    ha-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 0;
      vertical-align: middle;
    }

    /* Candidate Showcase Bar */
    .candidate-bar {
      background: #0d1117;
      border-bottom: 1px solid #30363d;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      position: sticky;
      top: 57px;
      z-index: 99;
    }

    .candidate-bar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .bar-title {
      font-size: 13px;
      font-weight: 700;
      color: #7ee787;
      white-space: nowrap;
    }

    .candidate-btns {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .c-btn {
      background: #161b22;
      border: 1px solid #30363d;
      color: #c9d1d9;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .c-btn:hover {
      background: #21262d;
      border-color: #8b949e;
      color: #fff;
    }

    .c-btn.active {
      background: #238636;
      border-color: #2ea043;
      color: #ffffff;
      box-shadow: 0 1px 6px rgba(35, 134, 54, 0.4);
    }

    .candidate-bar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .mode-toggles {
      display: flex;
      background: #161b22;
      padding: 3px;
      border-radius: 8px;
      border: 1px solid #30363d;
      gap: 3px;
    }

    .mode-btn {
      background: transparent;
      border: 0;
      color: #8b949e;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .mode-btn.active {
      background: #1f6feb;
      color: #fff;
    }

    .lock-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }

    .lock-toggle-btn.locked {
      background: #065f46;
      color: #6ee7b7;
      border-color: #059669;
      box-shadow: 0 1px 4px rgba(6, 95, 70, 0.4);
    }

    .lock-toggle-btn.unlocked {
      background: #7f1d1d;
      color: #fca5a5;
      border-color: #dc2626;
      box-shadow: 0 1px 6px rgba(220, 38, 38, 0.4);
      animation: alert-flash 1.5s infinite;
    }

    @keyframes alert-flash {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; }
    }

    .candidate-desc-bar {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: #8b949e;
      line-height: 1.5;
    }

    .desc-badge {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .desc-text b {
      color: #f0f6fc;
    }

    .desc-text code {
      background: rgba(255, 255, 255, 0.1);
      padding: 1px 5px;
      border-radius: 4px;
      color: #34d399;
      font-family: monospace;
    }
  </style>
</head>

    <div class="candidate-bar-right">

      <button class="lock-toggle-btn locked" id="btnGlobalLockToggle">

        <span id="globalLockLabel">차량 잠김</span>
      </button>
    </div>
  </div>

  <div class="candidate-desc-bar" id="candidateDescBar">
    <div class="desc-badge" id="descBadge">주행거리 후보 1</div>
    <div class="desc-text" id="candidateDescText">
      <b>[후보 1: 인라인 슬래시]</b> 배터리 SOC 퍼센트 바로 우측에 은은한 <code>| 340 km</code> 구분선과 함께 인라인 배치하여 한눈에 확인합니다.
    </div>
  </div>

      <div class="frame-inner">
        <carrot-dashboard-debug-card id="debugCard"></carrot-dashboard-debug-card>

    </div>

    class HaIcon extends HTMLElement {
      connectedCallback() {
        this.render();
      }
      static get observedAttributes() { return ['icon']; }
      attributeChangedCallback() { this.render(); }
      render() {
        const fullIcon = this.getAttribute('icon') || '';
        const name = fullIcon.replace(/^mdi:/, '');
        const path = ICONS[name] || '<circle cx="12" cy="12" r="6"/>';
        this.innerHTML = `<svg viewBox="0 0 24 24" style="width:var(--mdc-icon-size,20px);height:var(--mdc-icon-size,20px);display:block;margin:auto;fill:currentColor;" aria-hidden="true">${path}</svg>`;
      }
    }

    // 2. Load Dashboard Modules

    function updateMapHalfStyle() {
      const card = debugCard?.dashCard;
      if (!card || !card.shadowRoot) return;

      let styleEl = card.shadowRoot.querySelector('#preview-map-half-enhancement');
      if (!styleEl) {
        styleEl = document.createElement('style');
        styleEl.id = 'preview-map-half-enhancement';
      }
      card.shadowRoot.appendChild(styleEl);

      if (mapHalfEnabled) {
        styleEl.textContent = MAP_HALF_CSS;
        mapHalfToggle.classList.remove('off');
        mapHalfToggle.textContent = '🗺️ 직사각형 50% 지도 적용 (ON)';
      } else {
        styleEl.textContent = `
          .shortcut { grid-template-columns: minmax(0, 1fr) 112px !important; }
          .mini-map { width: 112px !important; height: 112px !important; max-width: 112px !important; }
          @container (max-width: 700px) {
            .shortcut { grid-template-columns: minmax(0, 1fr) 100px !important; }
            .mini-map { width: 100px !important; height: 100px !important; max-width: 100px !important; }
          }
        `;
        mapHalfToggle.classList.add('off');
        mapHalfToggle.textContent = '🗺️ 기존 정사각형 (OFF)';
      }

      // Invalidate Leaflet maps after layout recalculation
      setTimeout(() => {
        if (card.miniMaps && card.miniMaps.length) {
          card.miniMaps.forEach(m => {
            try { m.invalidateSize(); } catch (e) {}
          });
        }
      }, 100);
    }

    // Hook into debugCard render cycle
    const checkReady = setInterval(() => {
      if (debugCard && debugCard.dashCard && debugCard.dashCard.shadowRoot) {
        clearInterval(checkReady);
        updateMapHalfStyle();

        // Also update whenever dashCard renders
        const origRender = debugCard.dashCard.render.bind(debugCard.dashCard);
        debugCard.dashCard.render = () => {
          origRender();
          updateMapHalfStyle();
        };
      }
    }, 150);

    mapHalfToggle.addEventListener('click', () => {
      mapHalfEnabled = !mapHalfEnabled;
      updateMapHalfStyle();
    });

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const w = btn.dataset.width;
        if (w === '100%') {
          container.style.width = '100%';
          widthLabel.textContent = `${container.clientWidth}px`;
        } else {
          container.style.width = `${w}px`;
          widthLabel.textContent = `${w}px`;
        }
        setTimeout(() => {
          if (debugCard?.dashCard?.miniMaps) {
            debugCard.dashCard.miniMaps.forEach(m => {
              try { m.invalidateSize(); } catch (e) {}
            });
          }
        }, 320);
      });
    });

    window.addEventListener('resize', () => {
      const activeBtn = document.querySelector('.viewport-btn.active');
      if (activeBtn && activeBtn.dataset.width === '100%') {
        widthLabel.textContent = `${container.clientWidth}px`;
      }
    });

    // 4. Candidate Showcase Controls
    const CANDIDATE_DESCRIPTIONS = {
      1: {
        badge: '현재 후보 1 (사용자 지정)',
        html: '<b>[후보 1: 통합 간결형 (유저 맞춤)]</b> 상단에 <code>차량 잠금 상태</code> 라벨, 중앙에 원형 아이콘과 단정한 <code>잠김 / 열림</code> 텍스트를 배치하고 하단에는 <code>모든 도어 닫힘 및 잠김</code> / <code>도어 열림</code> 2가지 상태만 표기합니다. 포인트 색상은 <b>충전중(초록색)</b>, <b>주차중(파랑색)</b> 배터리 색상과 1:1 일치하며, <b>충전 전력(11.0 kW)은 SOC 바로 위 충전 상태 텍스트 옆에 겹침 없이 인라인 배치</b>됩니다.'

    const RANGE_DESCRIPTIONS = {

      2: {
        badge: '주행거리 후보 2 (우측 독립 캡슐)',
        html: '<b>[후보 2: 우측 독립 캡슐 (Right-Aligned Capsule)]</b> 배터리 카드 우측 끝에 <code>주행 가능 340 km</code> 글래스모피즘 반투명 캡슐 배지를 독립 배치합니다. 좌측의 충전/배터리 정보와 우측의 잔여 거리 정보가 카드 전체에서 완벽한 시각적 균형을 이룹니다.'

    const cButtons = document.querySelectorAll('#candidateBtns .c-btn');
    const rcButtons = document.querySelectorAll('#rangeCandidateBtns .c-btn');
    const descBadge = document.getElementById('descBadge');
    const descText = document.getElementById('candidateDescText');
    const btnModeCharging = document.getElementById('btnModeCharging');
    const btnModeParked = document.getElementById('btnModeParked');
    const btnModeDriving = document.getElementById('btnModeDriving');
    const btnGlobalLockToggle = document.getElementById('btnGlobalLockToggle');
    const globalLockIcon = document.getElementById('globalLockIcon');
    const globalLockLabel = document.getElementById('globalLockLabel');

    function syncPreviewToolbar(state) {
      if (!state) return;
      const currentCand = state.candidate || 1;
      const currentRangeCand = state.rangeCandidate || 1;

      cButtons.forEach(b => {
        const c = Number(b.dataset.candidate);
        b.classList.toggle('active', c === currentCand);
      });
      rcButtons.forEach(b => {
        const rc = Number(b.dataset.rangeCandidate);
        b.classList.toggle('active', rc === currentRangeCand);
      });

      if (RANGE_DESCRIPTIONS[currentRangeCand]) {
        if (descBadge) descBadge.textContent = RANGE_DESCRIPTIONS[currentRangeCand].badge;
        if (descText) descText.innerHTML = RANGE_DESCRIPTIONS[currentRangeCand].html;
      }

      const isCharging = state.mode === 'charging';
      const isDriving = state.mode === 'driving';
      const isParked = !isCharging && !isDriving;
      btnModeCharging?.classList.toggle('active', isCharging);
      btnModeParked?.classList.toggle('active', isParked);
      btnModeDriving?.classList.toggle('active', isDriving);

      const anyDoorOpen = state.doors ? Object.values(state.doors).some(Boolean) : false;
      const isLocked = !anyDoorOpen && (state.doors_locked !== false);
      if (btnGlobalLockToggle) {
        btnGlobalLockToggle.className = `lock-toggle-btn ${isLocked ? 'locked' : 'unlocked'}`;
        if (globalLockIcon) globalLockIcon.textContent = isLocked ? '🔒' : '🔓';
        if (globalLockLabel) {
          if (anyDoorOpen) {
            const count = Object.values(state.doors).filter(Boolean).length;
            globalLockLabel.textContent = `도어 ${count}개 열림`;
          } else {
            globalLockLabel.textContent = isLocked ? '차량 잠김' : '차량 열림';
          }
        }
      }
    }
    window.__updatePreviewToolbar = syncPreviewToolbar;

    rcButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const rc = Number(btn.dataset.rangeCandidate);
        if (debugCard) {
          debugCard.state.rangeCandidate = rc;
          debugCard.applyDebugTelemetry();
          if (debugCard.__syncFromExternal) {
            debugCard.__syncFromExternal({ rangeCandidate: rc });
          }
          syncPreviewToolbar(debugCard.state);
        }
      });
    });

    cButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const cand = Number(btn.dataset.candidate);
        if (debugCard) {
          debugCard.state.candidate = cand;
          debugCard.applyDebugTelemetry();
          if (debugCard.__syncFromExternal) {
            debugCard.__syncFromExternal({ candidate: cand });

          syncPreviewToolbar(debugCard.state);
        }
      });

        debugCard.state.mode = 'charging';

        if (debugCard.__syncFromExternal) {
          debugCard.__syncFromExternal({ mode: 'charging' });
        }
        syncPreviewToolbar(debugCard.state);
      }
    });

    btnModeParked?.addEventListener('click', () => {
      if (debugCard) {
        debugCard.state.mode = 'parked';
        debugCard.applyDebugTelemetry();
        if (debugCard.__syncFromExternal) {
          debugCard.__syncFromExternal({ mode: 'parked' });
        }
        syncPreviewToolbar(debugCard.state);
      }
    });

    btnModeDriving?.addEventListener('click', () => {
      if (debugCard) {
        debugCard.state.mode = 'driving';
        debugCard.applyDebugTelemetry();
        if (debugCard.__syncFromExternal) {
          debugCard.__syncFromExternal({ mode: 'driving' });
        }
        syncPreviewToolbar(debugCard.state);
      }
    });

    btnGlobalLockToggle?.addEventListener('click', () => {
      if (debugCard) {
        const anyDoorOpen = debugCard.state.doors ? Object.values(debugCard.state.doors).some(Boolean) : false;
        const wasLocked = !anyDoorOpen && (debugCard.state.doors_locked !== false);
        const nextLock = !wasLocked;
        debugCard.state.doors_locked = nextLock;
        if (nextLock && debugCard.state.doors) {
          Object.keys(debugCard.state.doors).forEach(k => debugCard.state.doors[k] = false);
        }
        debugCard.applyDebugTelemetry();
        if (debugCard.__syncFromExternal) {
          debugCard.__syncFromExternal({ doors_locked: nextLock, doors: debugCard.state.doors });
        }
        syncPreviewToolbar(debugCard.state);
      }
    });

    // Initial check when debugCard is ready
    const initTimer = setInterval(() => {
      if (debugCard && debugCard.state) {
        clearInterval(initTimer);
        syncPreviewToolbar(debugCard.state);
      }
    }, 100);
  </script>
</body>
