<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrot HA Dashboard — Live Responsive Preview</title>
  <link rel="stylesheet" href="./custom_components/carrot_ha/frontend/carrot-assets/leaflet.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #090c10;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Preview Control Bar */
    .preview-header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #f0f6fc;
      white-space: nowrap;
    }

    .brand-title .badge-tag {
      background: #238636;
      color: #fff;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }

    .controls-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .viewport-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #0d1117;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid #30363d;
    }

    .viewport-btn {
      background: transparent;
      border: 0;
      color: #8b949e;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .viewport-btn:hover {
      color: #f0f6fc;
      background: #21262d;
    }

    .viewport-btn.active {
      background: #1f6feb;
      color: #ffffff;
      box-shadow: 0 1px 4px rgba(31, 111, 235, 0.4);
    }

    /* Map 50% Toggle Button */
    .map-toggle-btn {
      background: #065f46;
      color: #6ee7b7;
      border: 1px solid #059669;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 1px 4px rgba(6, 95, 70, 0.4);
    }

    .map-toggle-btn.off {
      background: #21262d;
      color: #8b949e;
      border-color: #30363d;
      box-shadow: none;
    }

    .width-indicator {
      font-size: 12px;
      color: #8b949e;
      font-variant-numeric: tabular-nums;
      min-width: 65px;
      text-align: right;
    }

    /* Viewport Stage */
    .preview-stage {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px 40px;
      background: radial-gradient(circle at top, #161b22 0%, #090c10 100%);
      overflow-x: auto;
    }

    .frame-container {
      width: 1280px;
      max-width: 100%;
      background: #0f141c;
      border-radius: 24px;
      border: 1px solid #30363d;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .frame-inner {
      padding: 16px;
    }

    ha-card {
      display: block;
    }

    ha-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
    }
  </style>
</head>
<body>

  <header class="preview-header">
    <div class="header-left">
      <div class="brand-title">
        <span>🥕 Carrot HA</span>
        <span>실시간 인터랙티브 프리뷰</span>
        <span class="badge-tag">실험실</span>
      </div>
    </div>

    <div class="controls-wrap">
      <button id="mapHalfToggle" class="map-toggle-btn">🗺️ 직사각형 50% 지도 적용 (ON)</button>

      <div class="viewport-controls">
        <button class="viewport-btn" data-width="390">📱 모바일 (390px)</button>
        <button class="viewport-btn" data-width="768">📱 태블릿 (768px)</button>
        <button class="viewport-btn" data-width="1024">💻 데스크탑 (1024px)</button>
        <button class="viewport-btn active" data-width="1280">🖥️ 데스크탑 (1280px)</button>
        <button class="viewport-btn" data-width="100%">↔️ 전체 폭 (100%)</button>
      </div>

      <div class="width-indicator" id="widthLabel">1280px</div>
    </div>
  </header>

  <main class="preview-stage">
    <div class="frame-container" id="frameContainer">
      <div class="frame-inner">
        <carrot-dashboard-debug-card id="debugCard"></carrot-dashboard-debug-card>
      </div>
    </div>
  </main>

  <script type="module">
    // 1. MDI Icons Polyfill with Common Home Assistant Vehicle Icons
    const ICONS = {

      'battery-90': '<path d="M16 6H8v2h8V6zm0 3H8v11h8V9zm.67-5C17.4 4 18 4.6 18 5.33v15.34A1.33 1.33 0 0 1 16.67 22H7.33A1.33 1.33 0 0 1 6 20.67V5.33C6 4.6 6.6 4 7.33 4H9V2h6v2h1.67z"/>',
      'battery-80': '<path d="M16 6H8v4h8V6zm0 5H8v9h8v-9zm.67-7C17.4 4 18 4.6 18 5.33v15.34A1.33 1.33 0 0 1 16.67 22H7.33A1.33 1.33 0 0 1 6 20.67V5.33C6 4.6 6.6 4 7.33 4H9V2h6v2h1.67z"/>',
      'battery-70': '<path d="M16 6H8v5h8V6zm0 6H8v8h8v-8zm.67-8C17.4 4 18 4.6 18 5.33v15.34A1.33 1.33 0 0 1 16.67 22H7.33A1.33 1.33 0 0 1 6 20.67V5.33C6 4.6 6.6 4 7.33 4H9V2h6v2h1.67z"/>',

      'battery-20': '<path d="M16 6H8v13h8V6zm0 14H8v0h8v0zm.67-16C17.4 4 18 4.6 18 5.33v15.34A1.33 1.33 0 0 1 16.67 22H7.33A1.33 1.33 0 0 1 6 20.67V5.33C6 4.6 6.6 4 7.33 4H9V2h6v2h1.67z"/>',
      'battery-10': '<path d="M16 6H8v14h8V6zm.67-2C17.4 4 18 4.6 18 5.33v15.34A1.33 1.33 0 0 1 16.67 22H7.33A1.33 1.33 0 0 1 6 20.67V5.33C6 4.6 6.6 4 7.33 4H9V2h6v2h1.67z"/>',
      'battery-outline': '<path d="M16 6H8v14h8V6zm.67-2C17.4 4 18 4.6 18 5.33v15.34A1.33 1.33 0 0 1 16.67 22H7.33A1.33 1.33 0 0 1 6 20.67V5.33C6 4.6 6.6 4 7.33 4H9V2h6v2h1.67z"/>',
      'battery-charging': '<path d="M12 20h4V6h-4m-1-4h6v2h1.67C17.4 4 18 4.6 18 5.33v15.34A1.33 1.33 0 0 1 16.67 22H7.33A1.33 1.33 0 0 1 6 20.67V5.33C6 4.6 6.6 4 7.33 4H9V2h6v2m-5 9h2v4l3-6h-2V7l-3 6z"/>',
      'car-battery': '<path d="M4 3v3h1V4h2v2h10V4h2v2h1V3m-17 4c-1.11 0-2 .89-2 2v10a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2m-14 4h4v2H5m10 0h4v2h-4m2-3v4h-2v-4z"/>',
      'counter': '<path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2m-2 10h-2v-2h2v2m0-4h-2V7h2v2m-4 4h-2v-2h2v2m0-4h-2V7h2v2M9 13H7v-2h2v2m0-4H7V7h2v2m8 8H7v-2h10v2z"/>',
      'routes': '<path d="M19 15.18V7c0-2.21-1.79-4-4-4s-4 1.79-4 4v10c0 1.1-.9 2-2 2s-2-.9-2-2V8.82C8.16 8.4 9 7.3 9 6c0-1.66-1.34-3-3-3S3 4.34 3 6c0 1.3.84 2.4 2 2.82V17c0 2.21 1.79 4 4 4s4-1.79 4-4V7c0-1.1.9-2 2-2s2 .9 2 2v8.18c-1.16.41-2 1.51-2 2.82 0 1.66 1.34 3 3 3s3-1.34 3-3c0-1.31-.84-2.41-2-2.82z"/>',
      'ev-station': '<path d="M19.77 7.23l.01-.01-3.72-3.72L15 4.56l2.11 2.11c-.94.36-1.61 1.26-1.61 2.33 0 1.38 1.12 2.5 2.5 2.5.36 0 .69-.08 1-.21v7.21c0 .55-.45 1-1 1s-1-.45-1-1V14c0-1.1-.9-2-2-2h-1V5c0-1.1-.9-2-2-2H6c-1.1 0-2 .9-2 2v16h10v-7.5h1.5v5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V9c0-.69-.28-1.32-.73-1.77zM12 10H6V5h6v5zm6 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/>',
      'cash': '<path d="M3 6h18v12H3V6m10 6a3 3 0 0 0-3-3 3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3m5 4V8h-2v8h2M6 8v8h2V8H6z"/>',
      'battery-plus': '<path d="M16.67 4C17.4 4 18 4.6 18 5.33v15.34A1.33 1.33 0 0 1 16.67 22H7.33A1.33 1.33 0 0 1 6 20.67V5.33C6 4.6 6.6 4 7.33 4H9V2h6v2h1.67M15 14h-2v2h-2v-2H9v-2h2v-2h2v2h2v2z"/>',
      'power-plug': '<path d="M16 7V3h-2v4h-4V3H8v4c-1.66 0-3 1.34-3 3v5.5c0 1.93 1.57 3.5 3.5 3.5H11v4h2v-4h2.5c1.93 0 3.5-1.57 3.5-3.5V10c0-1.66-1.34-3-3-3z"/>',
      'flash': '<path d="M7 2v11h3v9l7-12h-4l3-8z"/>',
      'speedometer': '<path d="M12 2C6.48 2 2 6.48 2 12c0 3.54 1.84 6.66 4.64 8.44.33.21.76.19 1.05-.07.31-.28.37-.73.17-1.08A7.95 7.95 0 0 1 4 12c0-4.41 3.59-8 8-8s8 3.59 8 8c0 2.76-1.4 5.2-3.53 6.65-.33.23-.42.67-.23 1.03.19.36.63.5 1 .32C19.78 18.23 22 15.38 22 12c0-5.52-4.48-10-10-10zm-1 5.5v5.09c-.6.35-1 .99-1 1.74 0 1.1.9 2 2 2s2-.9 2-2c0-.75-.4-1.39-1-1.74V7.5c0-.28-.22-.5-.5-.5s-.5.22-.5.5z"/>',
      'thermometer': '<path d="M15 13V5a3 3 0 0 0-6 0v8a5 5 0 1 0 6 0m-3-10a1 1 0 0 1 1 1v3h-2V4a1 1 0 0 1 1-1z"/>',
      'snowflake': '<path d="M21 11h-3.17l1.76-1.76-1.41-1.41L15.35 10.65l-2.35-1.35V6.5l2.29-2.29-1.41-1.41L12 4.67 10.12 2.8 8.71 4.21 11 6.5v2.8L8.65 10.65 5.82 7.83 4.41 9.24 6.17 11H3v2h3.17l-1.76 1.76 1.41 1.41 2.83-2.82 2.35 1.35V17.5l-2.29 2.29 1.41 1.41L12 19.33l1.88 1.87 1.41-1.41L13 17.5v-2.8l2.35-1.35 2.83 2.82 1.41-1.41L17.83 13H21v-2z"/>',
      'fan': '<path d="M12 11a1 1 0 1 0 1 1 1 1 0 0 0-1-1zm0-9a4 4 0 0 0-4 4c0 1.83 1.22 3.37 2.88 3.84A3 3 0 0 1 13 8.35V3.13A4 4 0 0 0 12 2zm8 6a4 4 0 0 0-4-4c-1.83 0-3.37 1.22-3.84 2.88A3 3 0 0 1 13.65 8H18.87A4 4 0 0 0 20 8zM4 12a4 4 0 0 0 4 4c1.83 0 3.37-1.22 3.84-2.88A3 3 0 0 1 10.35 12H5.13A4 4 0 0 0 4 12zm8 8a4 4 0 0 0 4-4c0-1.83-1.22-3.37-2.88-3.84A3 3 0 0 1 11 13.65v5.22A4 4 0 0 0 12 20z"/>',
      'road': '<path d="M18.11 2H5.89l-2 20h16.22l-2-20zM11 20H9v-4h2v4zm0-6H9v-4h2v4zm0-6H9V4h2v4zm4 12h-2v-4h2v4zm0-6h-2v-4h2v4zm0-6h-2V4h2v4z"/>',
      'clock-end': '<path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 14h-2v-6h2zm5 0h-2v-6h2z"/>',
      'timer-sand': '<path d="M6 2v6h.01L6 8.01 10 12l-4 4 .01.01H6V22h12v-5.99h-.01L18 16l-4-4 4-3.99-.01-.01H18V2H6zm10 14.5V20H8v-3.5l4-4 4 4zm-4-5l-4-4V4h8v3.5l-4 4z"/>',
      'check': '<path d="M21 7L9 19l-5.5-5.5 1.41-1.41L9 16.17 19.59 5.59 21 7z"/>',
      'content-copy': '<path d="M19 21H8V7h11m0-2H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2m-3-4H4a2 2 0 0 0-2 2v14h2V3h12V1z"/>'
    };

    class HaIcon extends HTMLElement {
      connectedCallback() {
        this.render();
      }
      static get observedAttributes() { return ['icon']; }
      attributeChangedCallback() { this.render(); }
      render() {
        const fullIcon = this.getAttribute('icon') || '';
        const name = fullIcon.replace(/^mdi:/, '');
        const path = ICONS[name] || '<circle cx="12" cy="12" r="6"/>';
        this.innerHTML = `<svg viewBox="0 0 24 24" style="width:var(--mdc-icon-size,20px);height:var(--mdc-icon-size,20px);display:inline-block;fill:currentColor;" aria-hidden="true">${path}</svg>`;
      }
    }
    if (!customElements.get('ha-icon')) customElements.define('ha-icon', HaIcon);

    // 2. Load Dashboard Modules
    const [{default: KoreanDashboard}, {default: EnglishDashboard}, {default: DebugDashboard}] = await Promise.all([
      import('./custom_components/carrot_ha/frontend/carrot-dashboard-ko.js'),
      import('./custom_components/carrot_ha/frontend/carrot-dashboard-en.js'),
      import('./custom_components/carrot_ha/frontend/carrot-dashboard-debug.js')
    ]);

    if (!customElements.get('carrot-dashboard-ko')) customElements.define('carrot-dashboard-ko', KoreanDashboard);
    if (!customElements.get('carrot-dashboard-en')) customElements.define('carrot-dashboard-en', EnglishDashboard);
    if (!customElements.get('carrot-dashboard-debug-card')) customElements.define('carrot-dashboard-debug-card', DebugDashboard);

    // 3. Viewport Switcher Controls
    const container = document.getElementById('frameContainer');
    const widthLabel = document.getElementById('widthLabel');
    const buttons = document.querySelectorAll('.viewport-btn');
    const debugCard = document.getElementById('debugCard');
    const mapHalfToggle = document.getElementById('mapHalfToggle');

    let mapHalfEnabled = true;

    // 50% Map Style Definition (Non-square, fully fills right half of card across all viewports)
    const MAP_HALF_CSS = `
      :host .shortcut,
      ha-card .shortcut,
      .shortcut {
        display: grid !important;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) !important;
        grid-template-rows: 1fr auto !important;
        gap: 12px !important;
        padding: 10px 10px 10px 14px !important;
        min-height: 124px !important;
        align-items: stretch !important;
      }

      :host .shortcut > span,
      ha-card .shortcut > span,
      .shortcut > span {
        grid-column: 1 !important;
        grid-row: 1 !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: flex-start !important;
        min-width: 0 !important;
        padding-top: 2px !important;
      }

      :host .shortcut > span b,
      ha-card .shortcut > span b,
      .shortcut > span b {
        font-size: 15px !important;
        line-height: 1.3 !important;
        white-space: nowrap !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
      }

      :host .shortcut > span small,
      ha-card .shortcut > span small,
      .shortcut > span small {
        font-size: 11px !important;
        line-height: 1.35 !important;
        margin-top: 4px !important;
        color: var(--muted) !important;
      }

      :host .shortcut > em,
      ha-card .shortcut > em,
      .shortcut > em {
        grid-column: 1 !important;
        grid-row: 2 !important;
        align-self: end !important;
        font-size: 11.5px !important;
        font-weight: 600 !important;
        padding-bottom: 2px !important;
      }

      /* Non-square rectangular map: completely fills the right 50% width and 100% height */
      :host .mini-map,
      :host .shortcut .mini-map,
      ha-card .mini-map,
      .shortcut .mini-map,
      .mini-map {
        grid-column: 2 !important;
        grid-row: 1 / 3 !important;
        width: 100% !important;
        height: 100% !important;
        min-height: 104px !important;
        max-width: none !important;
        max-height: none !important;
        aspect-ratio: auto !important;
        border-radius: 12px !important;
        overflow: hidden !important;
        align-self: stretch !important;
        justify-self: stretch !important;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08) !important;
      }

      /* Tablet (520px - 819px): 2-column shortcut layout */
      @container (min-width: 520px) and (max-width: 819px) {
        .overview-links {
          display: grid !important;
          grid-template-columns: 1fr 1fr !important;
          gap: 12px !important;
        }
      }

      /* Mobile & Compact Screens (< 820px) */
      @container (max-width: 819px) {
        .shortcut {
          min-height: 120px !important;
          padding: 10px 10px 10px 14px !important;
        }
      }

      /* Mobile (< 700px): override base ko dashboard container query */
      @container (max-width: 700px) {
        :host .shortcut,
        ha-card .shortcut,
        .shortcut {
          display: grid !important;
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) !important;
          grid-template-rows: 1fr auto !important;
          gap: 10px !important;
          padding: 10px 10px 10px 12px !important;
          min-height: 116px !important;
          align-items: stretch !important;
        }

        :host .mini-map,
        :host .shortcut .mini-map,
        ha-card .mini-map,
        .shortcut .mini-map,
        .mini-map {
          grid-column: 2 !important;
          grid-row: 1 / 3 !important;
          width: 100% !important;
          height: 100% !important;
          min-height: 96px !important;
          max-width: none !important;
          max-height: none !important;
          aspect-ratio: auto !important;
          border-radius: 12px !important;
          overflow: hidden !important;
          align-self: stretch !important;
          justify-self: stretch !important;
        }
      }
    `;

    function updateMapHalfStyle() {
      const card = debugCard?.dashCard;
      if (!card || !card.shadowRoot) return;

      let styleEl = card.shadowRoot.querySelector('#preview-map-half-enhancement');
      if (!styleEl) {
        styleEl = document.createElement('style');
        styleEl.id = 'preview-map-half-enhancement';
      }
      card.shadowRoot.appendChild(styleEl);

      if (mapHalfEnabled) {
        styleEl.textContent = MAP_HALF_CSS;
        mapHalfToggle.classList.remove('off');
        mapHalfToggle.textContent = '🗺️ 직사각형 50% 지도 적용 (ON)';
      } else {
        styleEl.textContent = `
          .shortcut { grid-template-columns: minmax(0, 1fr) 112px !important; }
          .mini-map { width: 112px !important; height: 112px !important; max-width: 112px !important; }
          @container (max-width: 700px) {
            .shortcut { grid-template-columns: minmax(0, 1fr) 100px !important; }
            .mini-map { width: 100px !important; height: 100px !important; max-width: 100px !important; }
          }
        `;
        mapHalfToggle.classList.add('off');
        mapHalfToggle.textContent = '🗺️ 기존 정사각형 (OFF)';
      }

      // Invalidate Leaflet maps after layout recalculation
      setTimeout(() => {
        if (card.miniMaps && card.miniMaps.length) {
          card.miniMaps.forEach(m => {
            try { m.invalidateSize(); } catch (e) {}
          });
        }
      }, 100);
    }

    // Hook into debugCard render cycle
    const checkReady = setInterval(() => {
      if (debugCard && debugCard.dashCard && debugCard.dashCard.shadowRoot) {
        clearInterval(checkReady);
        updateMapHalfStyle();

        // Also update whenever dashCard renders
        const origRender = debugCard.dashCard.render.bind(debugCard.dashCard);
        debugCard.dashCard.render = () => {
          origRender();
          updateMapHalfStyle();
        };
      }
    }, 150);

    mapHalfToggle.addEventListener('click', () => {
      mapHalfEnabled = !mapHalfEnabled;
      updateMapHalfStyle();
    });

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const w = btn.dataset.width;
        if (w === '100%') {
          container.style.width = '100%';
          widthLabel.textContent = `${container.clientWidth}px`;
        } else {
          container.style.width = `${w}px`;
          widthLabel.textContent = `${w}px`;
        }
        setTimeout(() => {
          if (debugCard?.dashCard?.miniMaps) {
            debugCard.dashCard.miniMaps.forEach(m => {
              try { m.invalidateSize(); } catch (e) {}
            });
          }
        }, 320);
      });
    });

    window.addEventListener('resize', () => {
      const activeBtn = document.querySelector('.viewport-btn.active');
      if (activeBtn && activeBtn.dataset.width === '100%') {
        widthLabel.textContent = `${container.clientWidth}px`;
      }
    });
  </script>
</body>
</html>
